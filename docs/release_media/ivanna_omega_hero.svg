    <text x="416" y="26" fill="#A97FFF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">03 · 5 EJES + COCHLEAR</text>
    <text x="416" y="50" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="15" font-weight="800">0.00 ms Latencia</text>
    <text x="416" y="70" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10.5">Bark + CVNN + HOA4 + PINN</text>

    <!-- Card 4 -->
    <rect x="600" y="0" width="188" height="92" rx="12" fill="#0B1120" fill-opacity="0.88" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.45"/>
    <text x="616" y="26" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">04 · ESPACIAL REAL</text>
    <text x="616" y="50" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="15" font-weight="800">SOFA · SAF · 200 RIR</text>
    <text x="616" y="70" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10.5">WFS 2.5D + True-Stereo 4x</text>

