<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="760" viewBox="0 0 1800 760" role="img" aria-labelledby="title desc">
<title id="title">IVANNA OMEGA SUPREME — The Art of Sound</title>
<desc id="desc">Portada editorial de lujo inspirada en atlas renacentistas, instrumentos astronómicos y ondas acústicas: esfera central armónica, anillos de precisión, constelaciones geométricas y oro sobre azul noche. Ilustración conceptual, no una medición ni una promesa de rendimiento.</desc>
<defs>
 <linearGradient id="velvet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#040813"/><stop offset=".36" stop-color="#0a1729"/><stop offset=".7" stop-color="#10172b"/><stop offset="1" stop-color="#030711"/></linearGradient>
 <radialGradient id="aura"><stop stop-color="#40e6ed" stop-opacity=".25"/><stop offset=".45" stop-color="#537fff" stop-opacity=".11"/><stop offset="1" stop-color="#537fff" stop-opacity="0"/></radialGradient>
 <radialGradient id="orb" cx=".32" cy=".25" r=".78"><stop stop-color="#a8f9f5" stop-opacity=".95"/><stop offset=".22" stop-color="#397f9a" stop-opacity=".9"/><stop offset=".56" stop-color="#152d51"/><stop offset=".82" stop-color="#091326"/><stop offset="1" stop-color="#020611"/></radialGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2=".2"><stop stop-color="#946a2c"/><stop offset=".23" stop-color="#f1d68c"/><stop offset=".48" stop-color="#fff2c7"/><stop offset=".72" stop-color="#c99948"/><stop offset="1" stop-color="#f7e4a5"/></linearGradient>
 <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d1ffff"/><stop offset=".45" stop-color="#55e9f0"/><stop offset="1" stop-color="#537cff"/></linearGradient>
 <pattern id="microgrid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#9dc7e0" stroke-opacity=".07" stroke-width="1"/></pattern>
 <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="14"/></filter>
 <filter id="smallGlow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>
 <clipPath id="sphereClip"><circle cx="1245" cy="350" r="190"/></clipPath>
</defs>
<rect width="1800" height="760" rx="28" fill="url(#velvet)"/><rect width="1800" height="760" rx="28" fill="url(#microgrid)"/>
<circle cx="1245" cy="350" r="365" fill="url(#aura)"/>
<!-- fine engraved frame -->
<g fill="none" stroke="url(#gold)" stroke-opacity=".58">
