<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#0b111e"/>
      <stop offset="50%" stop-color="#05080f"/>
      <stop offset="100%" stop-color="#020407"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="25%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pinkGlow" cx="75%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#ff2e93" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ff2e93" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="50%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear Gradients for UI Elements -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe699"/>
      <stop offset="50%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#e09f19"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ff2e93" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffd166" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141e33" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#090d17" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Filters for Glow & Shadows -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowPink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="480" fill="url(#bgGrad)"/>
  <rect width="1200" height="480" fill="url(#cyanGlow)"/>
  <rect width="1200" height="480" fill="url(#pinkGlow)"/>
  <rect width="1200" height="480" fill="url(#goldGlow)"/>

  <!-- Precision Technical Grid & Coordinate Lines -->
  <g stroke="#1a253a" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.6">
    <line x1="60" y1="0" x2="60" y2="480"/>
    <line x1="200" y1="0" x2="200" y2="480"/>
    <line x1="400" y1="0" x2="400" y2="480"/>
    <line x1="600" y1="0" x2="600" y2="480"/>
    <line x1="800" y1="0" x2="800" y2="480"/>
    <line x1="1000" y1="0" x2="1000" y2="480"/>
    <line x1="1140" y1="0" x2="1140" y2="480"/>
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
  </g>

  <!-- Background Acoustic Raycasting Vectors (Sabine Simulation) -->
  <g stroke="#00f0ff" stroke-width="0.8" opacity="0.18">
    <path d="M 120 420 L 320 80 L 520 400 L 750 120 L 980 430 L 1120 180" fill="none"/>
    <path d="M 160 400 L 380 120 L 600 360 L 840 90 L 1080 390" fill="none" stroke="#ff2e93"/>
  </g>

  <!-- Outer Frame Border -->
  <rect x="20" y="20" width="1160" height="440" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="1.2" opacity="0.65"/>
  <rect x="26" y="26" width="1148" height="428" rx="12" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.08"/>

  <!-- Corner Brackets (Aerospace / Pro Audio Rig Aesthetic) -->
  <g stroke="#00f0ff" stroke-width="2.5" fill="none" opacity="0.85">
    <path d="M 20 50 L 20 20 L 50 20"/>
    <path d="M 1150 20 L 1180 20 L 1180 50"/>
    <path d="M 1180 430 L 1180 460 L 1150 460"/>
    <path d="M 50 460 L 20 460 L 20 430"/>
  </g>

  <!-- Header Micro-Labels -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="10.5" letter-spacing="2" fill="#64748b" font-weight="600">
    <text x="50" y="52">HAL AUDIOFLINGER · INSERT &amp; POSTPROCESS</text>
    <text x="600" y="52" text-anchor="middle" fill="#00f0ff" opacity="0.9">⚡ C++20 / NEON RT-KERNEL · ZERO-LATENCY A/V SYNC</text>
    <text x="1150" y="52" text-anchor="end">SYS-ID: 4956414E-4E41-4F4D-4547</text>
  </g>

  <!-- Main Brand Title Group -->
  <g transform="translate(600, 155)">
    <!-- Hex Emblem Icon Central Background Glow -->
    <polygon points="0,-64 55,-32 55,32 0,64 -55,32 -55,-32" fill="#0c1726" stroke="#00f0ff" stroke-width="1.5" filter="url(#glowCyan)" opacity="0.7"/>
    <polygon points="0,-52 45,-26 45,26 0,52 -45,26 -45,-26" fill="none" stroke="#ff2e93" stroke-width="1.2" opacity="0.8"/>
    <!-- Center Omega Glyph -->
    <text x="0" y="14" font-family="'JetBrains Mono', Georgia, serif" font-size="44" font-weight="900" fill="url(#goldGrad)" text-anchor="middle">Ω</text>

    <!-- Main Typography -->
    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-size="42" font-weight="900" letter-spacing="4" fill="#ffffff" text-anchor="middle">
      IVANNA <tspan fill="url(#goldGrad)">OMEGA</tspan> SUPREME
    </text>
    
    <!-- Version Tag Pill -->
    <g transform="translate(0, 115)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#00f0ff" fill-opacity="0.12" stroke="#00f0ff" stroke-width="1.2"/>
      <text x="0" y="5" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" fill="#00f0ff" letter-spacing="1.5" text-anchor="middle">v2.4.1 STABLE</text>
    </g>

    <!-- Subtitle Definition -->
    <text x="0" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#94a3b8" letter-spacing="1.2" text-anchor="middle">
      Sistema Operativo Neuroacústico en Lazo Cerrado para Android · Arquitectura Anti-Dolby
    </text>
    <text x="0" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38bdf8" letter-spacing="0.8" text-anchor="middle">
      Diseñado e Investigado por <tspan fill="#ffd166">Luis Uriel Pimentel Pérez (GORE TNS)</tspan>
    </text>
  </g>

  <!-- Technical Verified Cards (Bottom Grid) -->
  <!-- Card 1: DSP Engine Core -->
  <g transform="translate(60, 368)">
    <rect width="245" height="74" rx="10" fill="url(#glassFill)" stroke="#1e293b" stroke-width="1.2" filter="url(#cardShadow)"/>
    <rect width="4" height="74" rx="2" fill="#00f0ff"/>
    <text x="18" y="24" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#00f0ff" letter-spacing="1">NATIVE AUDIO KERNEL</text>
    <text x="18" y="46" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="800" fill="#f8fafc">456 Archivos · C++20</text>
    <text x="18" y="63" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="500" fill="#64748b">174.6K LOC · SIMD NEON</text>
  </g>

  <!-- Card 2: Deterministic Testing & Safety Gates -->
  <g transform="translate(330, 368)">
    <rect width="250" height="74" rx="10" fill="url(#glassFill)" stroke="#1e293b" stroke-width="1.2" filter="url(#cardShadow)"/>
    <rect width="4" height="74" rx="2" fill="#23f09a"/>
    <text x="18" y="24" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#23f09a" letter-spacing="1">CERTIFICACIÓN CTEST</text>
    <text x="18" y="46" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="800" fill="#f8fafc">174 / 174 PASS</text>
    <text x="18" y="63" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="500" fill="#64748b">6/6 Puertas · ASan+UBSan</text>
  </g>

  <!-- Card 3: Cinema & Streaming Sync -->
  <g transform="translate(605, 368)">
    <rect width="255" height="74" rx="10" fill="url(#glassFill)" stroke="#1e293b" stroke-width="1.2" filter="url(#cardShadow)"/>
    <rect width="4" height="74" rx="2" fill="#ff2e93"/>
    <text x="18" y="24" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#ff2e93" letter-spacing="1">AMAZON PRIME &amp; CINEMA</text>
    <text x="18" y="46" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="800" fill="#f8fafc">0.00 ms A/V Desfase</text>
    <text x="18" y="63" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="500" fill="#64748b">Zero-Echo · Center Lock</text>
  </g>

  <!-- Card 4: 12D Scene Atlas & C2 Guard -->
  <g transform="translate(885, 368)">
    <rect width="255" height="74" rx="10" fill="url(#glassFill)" stroke="#1e293b" stroke-width="1.2" filter="url(#cardShadow)"/>
    <rect width="4" height="74" rx="2" fill="#ffd166"/>
    <text x="18" y="24" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#ffd166" letter-spacing="1">ATLAS IVW1 &amp; C² GUARD</text>
    <text x="18" y="46" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="800" fill="#f8fafc">8 774 Pesos · C² SoftCeil</text>
    <text x="18" y="63" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="500" fill="#64748b">12 Estilos · -0.10 dBFS Peak</text>
  </g>
</svg>
