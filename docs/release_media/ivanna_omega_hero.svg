<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680" role="img" aria-labelledby="title desc">
<title id="title">IVANNA OMEGA SUPREME — The Art of Sound</title>
<desc id="desc">Portada editorial de inspiración renacentista y ciencia acústica: una esfera armónica tridimensional rodeada de órbitas, geometría sagrada, líneas de señal y luz dorada. Arte conceptual, no una medición física.</desc>
<defs>
  <linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050b17"/><stop offset=".42" stop-color="#101b31"/><stop offset=".76" stop-color="#111126"/><stop offset="1" stop-color="#050914"/></linearGradient>
  <radialGradient id="aura"><stop stop-color="#5ce8f2" stop-opacity=".28"/><stop offset=".48" stop-color="#6384ff" stop-opacity=".12"/><stop offset="1" stop-color="#6384ff" stop-opacity="0"/></radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0bd"/><stop offset=".28" stop-color="#d9b56e"/><stop offset=".58" stop-color="#fff0c2"/><stop offset="1" stop-color="#a87837"/></linearGradient>
  <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d4ffff"/><stop offset=".4" stop-color="#69dce9"/><stop offset=".72" stop-color="#8b9cff"/><stop offset="1" stop-color="#e1c8ff"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a6f7ff" stop-opacity=".24"/><stop offset=".5" stop-color="#4a8bdb" stop-opacity=".06"/><stop offset="1" stop-color="#f1c77a" stop-opacity=".18"/></linearGradient>
  <pattern id="microgrid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#a6c5e8" stroke-opacity=".07" stroke-width=".8"/></pattern>
  <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="lineGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
  <clipPath id="frame"><rect width="1600" height="680" rx="28"/></clipPath>
</defs>
<g clip-path="url(#frame)">
  <rect width="1600" height="680" fill="url(#night)"/>
  <rect width="1600" height="680" fill="url(#microgrid)"/>
  <ellipse cx="1160" cy="326" rx="510" ry="440" fill="url(#aura)"/>
  <g fill="none" stroke="#9ebde5" stroke-opacity=".18">
    <path d="M0 590 Q400 420 800 590 T1600 590"/>
    <path d="M0 615 Q400 445 800 615 T1600 615"/>
    <path d="M0 640 Q400 470 800 640 T1600 640"/>
