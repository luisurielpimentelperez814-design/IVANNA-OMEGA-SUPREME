    <text x="2" y="68" fill="#94A3B8" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13.5" letter-spacing="0.3">Ruta A (JNI App + MediaProjection + USB UAC2 Isócrono)  ⟷  OmegaControlBus SHM v5  ⟷  Ruta B (Magisk AudioFlinger GlobalEffect)</text>
  </g>

