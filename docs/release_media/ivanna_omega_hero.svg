  <!-- Editorial typography -->
  <g font-family="Georgia, 'Times New Roman', serif">
    <text x="94" y="90" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" letter-spacing="5.5" fill="#9ebbd9">AUDIO ENGINEERING  /  SPATIAL COMPUTING  /  ANDROID</text>
    <path d="M96 120H480" stroke="url(#gold)" stroke-width="1.4"/>
    <text x="88" y="222" font-size="73" font-weight="bold" letter-spacing="-2.5" fill="#f5f1e7">IVANNA OMEGA</text>
    <text x="91" y="307" font-size="82" font-weight="bold" letter-spacing="1.8" fill="url(#gold)">SUPREME</text>
    <text x="96" y="354" font-size="23" font-style="italic" fill="#c7d8ed">The art of sound, shaped by engineering.</text>
  </g>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="96" y="395" width="352" height="42" rx="21" fill="#10263b" stroke="#6cbfda" stroke-opacity=".65"/>
