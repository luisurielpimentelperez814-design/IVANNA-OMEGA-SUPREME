 <path d="M44 100H220M1580 100H1756M44 660H220M1580 660H1756" stroke-opacity=".28"/>
 <circle cx="1245" cy="350" r="267" stroke-width="1.1"/><circle cx="1245" cy="350" r="281" stroke-dasharray="1 9" stroke-width="2"/><circle cx="1245" cy="350" r="303" stroke-opacity=".3"/>
</g>
<!-- typography -->
<g font-family="Georgia,'Times New Roman',serif">
 <text x="108" y="112" fill="url(#gold)" font-size="17" letter-spacing="7">AN ATLAS OF IMMERSIVE SOUND</text>
 <path d="M108 137H695" stroke="url(#gold)" stroke-width="1.2" stroke-opacity=".7"/>
 <text x="100" y="245" fill="#f8f4e9" font-size="72" letter-spacing="1.5">IVANNA</text>
 <text x="100" y="329" fill="#f8f4e9" font-size="72" letter-spacing="1.5">OMEGA</text>
