    <text x="1016" y="26" fill="#FFD166" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">06 · VERIFICACIÓN CI</text>
    <text x="1016" y="50" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="15" font-weight="800">150/150 CTest PASS</text>
