    <path d="M835 440 C872 440 877 401 911 401 S947 470 982 470 S1015 365 1051 365 S1085 411 1115 411" stroke="#8af2f4" stroke-width="2.3"/>
    <path d="M1205 215 C1236 215 1240 184 1270 184 S1304 244 1333 244 S1364 193 1395 193 S1426 218 1450 218" stroke="#d4bdff" stroke-width="2.1"/>
    <path d="M1040 118 Q1160 42 1280 118" stroke="url(#gold)" stroke-width="1.5" opacity=".7"/>
    <path d="M1040 526 Q1160 602 1280 526" stroke="url(#gold)" stroke-width="1.5" opacity=".7"/>
