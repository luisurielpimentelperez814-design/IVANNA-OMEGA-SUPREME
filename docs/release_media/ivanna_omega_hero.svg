      <stop offset="0%" stop-color="#05060A"/>
      <stop offset="45%" stop-color="#0A0E1A"/>
      <stop offset="100%" stop-color="#070912"/>
    </linearGradient>
    <radialGradient id="auroraCyan" cx="22%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.20"/>
      <stop offset="55%" stop-color="#0077FF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraMagenta" cx="80%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#FF2E93" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#7928CA" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="42%" stop-color="#70F5FF"/>
      <stop offset="78%" stop-color="#B983FF"/>
      <stop offset="100%" stop-color="#FF4D9D"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="50%" stop-color="#FFF3B0"/>
      <stop offset="100%" stop-color="#F4A261"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#7928CA" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF2E93" stop-opacity="0.65"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.45"/>
    </pattern>
  </defs>

  <!-- Background -->
