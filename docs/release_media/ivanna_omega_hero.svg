    <polygon points="0,-52 45,-26 45,26 0,52 -45,26 -45,-26" fill="none" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="4 3"/>
    <text x="0" y="16" text-anchor="middle" fill="url(#titleGrad)" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="52" font-weight="900">Ω</text>
