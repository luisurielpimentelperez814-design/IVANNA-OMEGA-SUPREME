 <text x="106" y="463" fill="#a6dfe5" font-size="22" letter-spacing="5">THE ART OF SOUND</text>
 <text x="108" y="521" fill="#d4d8e1" font-family="Arial,sans-serif" font-size="17">Ingeniería de audio · herramientas espaciales</text>
 <text x="108" y="550" fill="#d4d8e1" font-family="Arial,sans-serif" font-size="17">Medición, control y verificación en Android</text>
</g>
