  <rect width="1280" height="440" rx="22" fill="url(#grid)"/>
  <rect width="1280" height="440" rx="22" fill="url(#auroraCyan)"/>
  <rect width="1280" height="440" rx="22" fill="url(#auroraMagenta)"/>
  <rect x="2" y="2" width="1276" height="436" rx="20" fill="none" stroke="url(#borderGrad)" stroke-width="2"/>

