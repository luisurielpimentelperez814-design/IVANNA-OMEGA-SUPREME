  <path d="M 0 320 Q 160 250, 320 320 T 640 320 T 960 320 T 1280 320" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.18"/>
  <path d="M 0 335 Q 160 395, 320 335 T 640 335 T 960 335 T 1280 335" fill="none" stroke="#FF2E93" stroke-width="1.5" stroke-opacity="0.16"/>
  <path d="M 0 328 Q 160 280, 320 328 T 640 328 T 960 328 T 1280 328" fill="none" stroke="#A97FFF" stroke-width="1.2" stroke-opacity="0.14"/>

  <!-- Top Telemetry Header Bar -->
  <g transform="translate(48, 34)">
    <rect x="0" y="0" width="356" height="28" rx="14" fill="#0F172A" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="16" cy="14" r="4.5" fill="#23F09A"/>
    <text x="30" y="18" fill="#E2E8F0" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11.5" font-weight="600" letter-spacing="0.8">RELEASE v2.3.16 · C++23 · ARM64 NEON SIMD</text>

    <rect x="372" y="0" width="430" height="28" rx="14" fill="#0F172A" stroke="#A97FFF" stroke-width="1" stroke-opacity="0.45"/>
    <text x="390" y="18" fill="#CBD5E1" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11.5" font-weight="600" letter-spacing="0.6">OMNI-HOLOGRAPHIC SINGULARITY · C2 SOFT CEILING</text>

    <rect x="818" y="0" width="366" height="28" rx="14" fill="#0F172A" stroke="#FFD166" stroke-width="1" stroke-opacity="0.55"/>
    <text x="836" y="18" fill="url(#goldGrad)" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11.5" font-weight="700" letter-spacing="0.8">LUIS URIEL PIMENTEL PÉREZ · GORE TNS</text>
  </g>

