<path d="M1484 611H1648" stroke="url(#gold)" stroke-opacity=".6"/>
<text x="900" y="710" font-family="Georgia,serif" font-style="italic" font-size="14" fill="#a8bbcd">La belleza de una idea comienza donde la precisión puede explicarla.</text>
