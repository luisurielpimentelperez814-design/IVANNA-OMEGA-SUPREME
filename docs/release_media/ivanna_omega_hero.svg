    <text x="136" y="421" font-size="13" font-weight="700" letter-spacing="1.2" fill="#d8f4ff">KOTLIN  ·  C++  ·  DSP  ·  3D</text>
    <text x="96" y="486" font-size="19" fill="#d5e1f1">Un laboratorio de audio digital y percepción espacial.</text>
    <text x="96" y="516" font-size="19" fill="#d5e1f1">Código inspeccionable. Límites explícitos. Pruebas reales.</text>
    <g transform="translate(96 574)">
      <path d="M0 0H390" stroke="#9ab8d8" stroke-opacity=".35"/>
      <text x="0" y="27" font-size="12" letter-spacing="2.2" fill="#9ebbd9">EN DESARROLLO</text>
      <circle cx="149" cy="23" r="2.5" fill="#d9b56e"/>
      <text x="164" y="27" font-size="12" letter-spacing="1.7" fill="#9ebbd9">EXPERIMENTAL</text>
      <circle cx="302" cy="23" r="2.5" fill="#d9b56e"/>
      <text x="317" y="27" font-size="12" letter-spacing="1.7" fill="#9ebbd9">VERIFICABLE</text>
    </g>
  </g>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" fill="#9ebbd9" font-size="11" letter-spacing="2">
    <text x="1374" y="620" text-anchor="end">FIG. 01 — HARMONIC ORRERY</text>
    <text x="1374" y="640" text-anchor="end" fill="#7188a8" letter-spacing="1">CONCEPT ART · NOT A MEASUREMENT</text>
