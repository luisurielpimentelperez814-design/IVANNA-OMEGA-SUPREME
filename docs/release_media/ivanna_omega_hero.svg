    <text x="16" y="26" fill="#00F0FF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">01 · SINGULARITY ENGINE</text>
    <text x="16" y="50" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="15" font-weight="800">Lazo Cerrado RT</text>
