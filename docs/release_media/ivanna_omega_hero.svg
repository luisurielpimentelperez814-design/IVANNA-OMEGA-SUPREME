    <circle cx="1160" cy="322" r="292" stroke-dasharray="2 14"/>
  </g>
  <!-- Renaissance-inspired ornamental geometry -->
  <g transform="translate(1160 322)" fill="none" stroke="url(#gold)" stroke-width="1.15" opacity=".7">
    <circle r="222"/><circle r="198"/><circle r="156"/><circle r="112"/>
