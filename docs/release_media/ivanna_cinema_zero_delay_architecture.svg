<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="100%">
  <defs>
    <!-- Background & Glass Gradients -->
    <radialGradient id="archBg" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#0c1322"/>
      <stop offset="100%" stop-color="#03060b"/>
    </radialGradient>
    <linearGradient id="badPath" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3366"/>
      <stop offset="100%" stop-color="#990033"/>
    </linearGradient>
    <linearGradient id="goodPath" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#23f09a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141f33" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0b111c" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="1100" height="520" fill="url(#archBg)" rx="16"/>

  <!-- Border & Technical Header -->
  <rect x="15" y="15" width="1070" height="490" rx="14" fill="none" stroke="#1e293b" stroke-width="1.2"/>
  <g font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b" font-weight="700">
    <text x="35" y="42">IVANNA OMEGA SUPREME v2.4.1 · CINEMA &amp; STREAMING ACOUSTIC ARBITER</text>
    <text x="1065" y="42" text-anchor="end" fill="#00f0ff">ZERO-DESFASE &amp; ZERO-ECHO ARCHITECTURE</text>
  </g>
  <line x1="35" y1="52" x2="1065" y2="52" stroke="#1e293b" stroke-width="1"/>

  <!-- SECTION 1: THE PROBLEM (TRADITIONAL LOOPBACK TRAP) -->
  <g transform="translate(35, 75)">
    <!-- Header of Problem -->
    <rect width="495" height="400" rx="12" fill="url(#cardGrad)" stroke="#ff3366" stroke-width="1.2" stroke-opacity="0.4" filter="url(#boxShadow)"/>
    <rect x="0" y="0" width="495" height="38" rx="12" fill="#ff3366" fill-opacity="0.12"/>
    <text x="20" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800" fill="#ff3366" letter-spacing="1">
      ❌ ARQUITECTURA TRADICIONAL (DESFASE Y ECO EN STREAMING)
    </text>

    <!-- Node 1: Video App -->
    <g transform="translate(25, 55)">
      <rect width="445" height="52" rx="8" fill="#161f30" stroke="#334155" stroke-width="1"/>
      <text x="16" y="24" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#f1f5f9">Amazon Prime Video / Netflix / Disney+</text>
      <text x="16" y="42" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#94a3b8">Salida de audio directa al hardware (AudioTrack AOSP a 0 ms)</text>
    </g>

    <!-- Split Arrows -->
    <path d="M 85 110 L 85 145" stroke="#23f09a" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="95" y="132" font-family="'JetBrains Mono', monospace" font-size="10" fill="#23f09a">Sonido Directo (0 ms)</text>

    <path d="M 370 110 L 370 145" stroke="#ff3366" stroke-width="2" stroke-dasharray="4,3" fill="none"/>
    <text x="210" y="132" font-family="'JetBrains Mono', monospace" font-size="10" fill="#ff3366">Loopback Capture (MediaProjection)</text>

    <!-- Node 2: Loopback Engine & Delay -->
    <g transform="translate(25, 150)">
      <rect width="445" height="110" rx="8" fill="#1e141a" stroke="#ff3366" stroke-width="1"/>
      <text x="16" y="24" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#ff4d79">Captura + Re-inyección en AudioTrack (+35 ms)</text>
      <text x="16" y="44" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1">1. AudioRecord buffer (6.67 ms) + DSP lookahead (8.0 ms)</text>
      <text x="16" y="62" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1">2. AudioTrack HAL queue buffer (+18 a 25 ms de retardo)</text>
      <text x="16" y="80" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1">3. EnvironmentalReverb stock (Decay 2.4s + Early Slapback 30ms)</text>
      <text x="16" y="98" font-family="-apple-system, sans-serif" font-size="11" fill="#ff99aa">4. Virtualizer stock desfasando el canal central de diálogo</text>
    </g>

    <!-- Arrow to Speaker Collision -->
    <path d="M 85 265 L 85 295" stroke="#23f09a" stroke-width="2" fill="none"/>
    <path d="M 370 265 L 370 295" stroke="#ff3366" stroke-width="2" fill="none"/>

    <!-- Collision Box: Speakers / Headphones Result -->
    <g transform="translate(25, 300)">
      <rect width="445" height="80" rx="8" fill="#2d101b" stroke="#ff3366" stroke-width="1.5"/>
      <text x="16" y="24" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#ff3366">💥 RESULTADO: EFECTO HAAS + FILTRADO EN PEINE</text>
      <text x="16" y="46" font-family="-apple-system, sans-serif" font-size="11.5" fill="#fecdd3">• Desfase Labial: Diálogo no coincide con la boca de los actores (+35ms)</text>
      <text x="16" y="64" font-family="-apple-system, sans-serif" font-size="11.5" fill="#fecdd3">• Eco de Baño Metálico: Diálogo duplicado + sala hueca</text>
    </g>
  </g>

  <!-- SECTION 2: THE IVANNA OMEGA SUPREME SOLUTION (v2.4.1) -->
  <g transform="translate(565, 75)">
    <!-- Header of Solution -->
    <rect width="495" height="400" rx="12" fill="url(#cardGrad)" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.4" filter="url(#boxShadow)"/>
    <rect x="0" y="0" width="495" height="38" rx="12" fill="#00f0ff" fill-opacity="0.12"/>
    <text x="20" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800" fill="#00f0ff" letter-spacing="1">
      ⚡ SOLUCIÓN IVANNA OMEGA SUPREME v2.4.1 (SINCRONÍA PURA)
    </text>

    <!-- Node 1: Video App Detection -->
    <g transform="translate(25, 55)">
      <rect width="445" height="52" rx="8" fill="#0b1e2c" stroke="#00f0ff" stroke-width="1"/>
      <text x="16" y="24" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#f1f5f9">Detector Dinámico de Video Streaming</text>
      <text x="16" y="42" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#38bdf8">UID Exclude Automático en AudioPlaybackCapture · Mute AudioTrack</text>
    </g>

    <!-- Flow Arrow -->
    <path d="M 247 110 L 247 145" stroke="#00f0ff" stroke-width="2" fill="none"/>

    <!-- Node 2: Dual Mode Direct Processing -->
    <g transform="translate(25, 150)">
      <rect width="445" height="110" rx="8" fill="#081a24" stroke="#23f09a" stroke-width="1"/>
      <text x="16" y="24" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#23f09a">Procesamiento In-Place Nativo (FastPath 0.00 ms)</text>
      <text x="16" y="44" font-family="-apple-system, sans-serif" font-size="11" fill="#e2e8f0">1. Root: libomega_effect HAL en AudioFlinger (0.00 ms latencia)</text>
      <text x="16" y="62" font-family="-apple-system, sans-serif" font-size="11" fill="#e2e8f0">2. Center Stem Phase-Lock: Diálogo directo sin retardo Woodworth ITD</text>
      <text x="16" y="80" font-family="-apple-system, sans-serif" font-size="11" fill="#e2e8f0">3. RIR Direct-Peak Alignment: Alineación TOF al sample 0 (0 slapback)</text>
      <text x="16" y="98" font-family="-apple-system, sans-serif" font-size="11" fill="#38bdf8">4. Zero-Reverb Bypass: Reverb y Virtualizer desactivados en video</text>
    </g>

    <!-- Arrow to Clean Output -->
    <path d="M 247 265 L 247 295" stroke="#23f09a" stroke-width="2" fill="none"/>

    <!-- Solution Output Box -->
    <g transform="translate(25, 300)">
      <rect width="445" height="80" rx="8" fill="#062419" stroke="#23f09a" stroke-width="1.5"/>
      <text x="16" y="24" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#23f09a">✨ RESULTADO: SUPREMACÍA ACÚSTICA CINEMATOGRÁFICA</text>
      <text x="16" y="46" font-family="-apple-system, sans-serif" font-size="11.5" fill="#a7f3d0">• Sincronía Labial Absoluta: 0.00 ms de desfase en Amazon Prime &amp; Netflix</text>
      <text x="16" y="64" font-family="-apple-system, sans-serif" font-size="11.5" fill="#a7f3d0">• Claridad Vocal Cristalina: Diálogo enfocado al frente sin eco parásito</text>
    </g>
  </g>
</svg>
