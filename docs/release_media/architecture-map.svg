<g fill="none" stroke="#d5b46a" stroke-opacity=".34"><circle cx="700" cy="350" r="280"/><circle cx="700" cy="350" r="300" stroke-dasharray="2 11"/><path d="M700 55V640M405 350H995M491 141L909 559M909 141L491 559"/></g>
<text x="64" y="68" fill="url(#gold)" font-family="Georgia,serif" font-size="17" letter-spacing="4">IVANNA OMEGA SUPREME</text>
<text x="64" y="118" fill="#f5f3ec" font-family="Georgia,serif" font-size="36">Atlas de arquitectura</text>
<text x="66" y="148" fill="#a8bfd1" font-family="Arial,sans-serif" font-size="15">Mapa de áreas y límites de integración · lectura conceptual, no certificación</text>
