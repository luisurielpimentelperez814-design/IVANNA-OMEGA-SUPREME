<g fill="#edf2ed" font-size="26" text-anchor="middle"><text x="218" y="319">Audio de IVANNA</text><text x="572" y="319">DSP + resampler</text><text x="954" y="319">AudioTrack / salida</text></g>
<g fill="none" stroke="#a8c7c0" stroke-width="2" marker-end="url(#arrow)"><path d="M359 310h51"/><path d="M733 310h51"/></g>
<text x="88" y="387" fill="#b8c9cb" font-size="23">PLL software: timestamps → estimación de cola → corrección del resampler.</text>

<rect x="64" y="442" width="1072" height="176" rx="12" fill="#1a2331" stroke="#bfa479" stroke-opacity=".4"/>
<text x="88" y="483" fill="#d9bf8f" font-size="20" letter-spacing="2">02 / EFECTOS E INTEGRACIÓN</text>
<text x="88" y="533" fill="#edf0ee" font-size="29">Efectos Android</text><text x="600" y="533" fill="#edf0ee" font-size="29">Magisk · daemon · efecto nativo</text>
<text x="88" y="580" fill="#b8c9cb" font-size="23">Capacidades del dispositivo y sesión.</text><text x="600" y="580" fill="#b8c9cb" font-size="23">Root y ruta compatible; verificar en equipo.</text>
<path d="M565 510v85" stroke="#bfa479" stroke-opacity=".2"/>

<rect x="64" y="642" width="1072" height="150" rx="12" fill="#192435" stroke="#8ca5cc" stroke-opacity=".35"/>
<text x="88" y="683" fill="#b5c7e0" font-size="20" letter-spacing="2">03 / DASHBOARD WEB</text>
<text x="88" y="731" fill="#edf0ee" font-size="29">Configuración local · demostración explícita</text>
<text x="88" y="766" fill="#b8c9cb" font-size="23">El estado de la web no acredita por sí solo procesamiento DSP global.</text>

