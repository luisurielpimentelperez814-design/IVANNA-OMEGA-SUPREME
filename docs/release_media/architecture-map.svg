<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">Mapa de arquitectura de IVANNA OMEGA SUPREME</title><desc id="desc">Diagrama de arquitectura: interfaz Android, reproducción de audio de la aplicación, medición acústica, renderizador geométrico, captura AR experimental y puntos de integración HAL pendientes de validación.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081321"/><stop offset="1" stop-color="#111a2c"/></linearGradient><linearGradient id="ui" x2="1" y2="1"><stop stop-color="#153653"/><stop offset="1" stop-color="#14243a"/></linearGradient><linearGradient id="gold" x2="1"><stop stop-color="#ffe4a1"/><stop offset="1" stop-color="#dfa83f"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#80b7e8"/></marker></defs>
<rect width="1400" height="760" rx="24" fill="url(#bg)"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="54" y="58" font-size="15" letter-spacing="4" fill="#84a5cb">SYSTEM MAP / SOURCE-LEVEL VIEW</text><text x="54" y="104" font-size="34" font-weight="800" fill="#f0f5ff">Arquitectura y límites de integración</text><text x="54" y="135" font-size="16" fill="#9cb1cb">Mapa conceptual del código presente; no equivale a una certificación de hardware.</text>
<g stroke="#80b7e8" stroke-width="2" fill="none" marker-end="url(#arrow)">
<path d="M700 220V260"/><path d="M420 314H360V380"/><path d="M700 314V380"/><path d="M980 314H1040V380"/><path d="M360 466V510H700V548"/><path d="M700 466V548"/><path d="M1040 466V510H700"/><path d="M700 614V648"/>
</g>
<g><rect x="455" y="164" width="490" height="56" rx="14" fill="url(#ui)" stroke="#5f9ed8"/><text x="700" y="188" font-size="19" font-weight="700" text-anchor="middle" fill="#f4f8ff">Aplicación Android</text><text x="700" y="207" font-size="13" text-anchor="middle" fill="#a9c9e8">Kotlin · Jetpack Compose · servicios</text>
<rect x="190" y="260" width="1020" height="54" rx="13" fill="#152b3c" stroke="#4c86a9"/><text x="700" y="283" font-size="18" font-weight="700" text-anchor="middle" fill="#e6f6ff">Puentes y políticas de control</text><text x="700" y="301" font-size="13" text-anchor="middle" fill="#9cc6da">JNI / control de reproducción / permisos / lectura de estados disponibles</text></g>
<g><rect x="190" y="380" width="340" height="86" rx="13" fill="#132b39" stroke="#53b8c7"/><text x="360" y="408" font-size="18" font-weight="700" text-anchor="middle" fill="#c7f9ff">Audio de la app</text><text x="360" y="432" font-size="14" text-anchor="middle" fill="#9fc6d1">AudioTrack · resampler · PLL</text><text x="360" y="451" font-size="12" text-anchor="middle" fill="#80aab8">Solo cola de reproducción propia</text>
<rect x="530" y="380" width="340" height="86" rx="13" fill="#2c2634" stroke="#c29a66"/><text x="700" y="408" font-size="18" font-weight="700" text-anchor="middle" fill="#ffedc9">Medición acústica</text><text x="700" y="432" font-size="14" text-anchor="middle" fill="#d6c0a1">Tonos · micrófono · comparación</text><text x="700" y="451" font-size="12" text-anchor="middle" fill="#b7a287">Instrumento no calibrado</text>
<rect x="870" y="380" width="340" height="86" rx="13" fill="#202744" stroke="#8e91d5"/><text x="1040" y="408" font-size="18" font-weight="700" text-anchor="middle" fill="#e0e2ff">FotoHolo / espacio</text><text x="1040" y="432" font-size="14" text-anchor="middle" fill="#bfc3ef">ARCore · puntos 3D · exportación</text><text x="1040" y="451" font-size="12" text-anchor="middle" fill="#a1a6d2">Captura experimental</text></g>
<g><rect x="360" y="548" width="680" height="66" rx="13" fill="#182a37" stroke="#699bb4"/><text x="700" y="574" font-size="18" font-weight="700" text-anchor="middle" fill="#e6f5ff">Motor nativo C++ / DSP + herramientas geométricas</text><text x="700" y="595" font-size="13" text-anchor="middle" fill="#a7c2d5">Procesamiento y renderizador según las rutas implementadas</text>
<rect x="360" y="648" width="680" height="66" rx="13" fill="#30241f" stroke="#c28e62" stroke-dasharray="7 5"/><text x="700" y="674" font-size="18" font-weight="700" text-anchor="middle" fill="url(#gold)">HAL / PAL / ASRC del proveedor</text><text x="700" y="696" font-size="13" text-anchor="middle" fill="#d6bda7">Contrato de integración: binding físico no demostrado en Moto G85</text></g>
<text x="54" y="735" font-size="12" fill="#829bb8">Las flechas muestran relación funcional general, no garantizan que todos los módulos estén activos en cada ruta de audio.</text></g>
</svg>