<g font-family="Arial,sans-serif" font-size="12" fill="#9fb3c8"><text x="64" y="784">Las flechas expresan relaciones generales; no prueban que todos los módulos estén activos en cada reproducción.</text><text x="1336" y="784" text-anchor="end">DISEÑO · EVIDENCIA · VALIDACIÓN</text></g>
