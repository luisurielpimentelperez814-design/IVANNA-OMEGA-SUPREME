<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">IVANNA OMEGA SUPREME — mapa de arquitectura y evidencia</title>
<desc id="desc">Atlas técnico de las áreas de IVANNA: interfaz Android, reproducción propia, DSP nativo, medición y visualización espacial. Las rutas se muestran como relaciones generales. HAL/PAL está señalado como punto de integración no validado físicamente.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050a15"/><stop offset=".5" stop-color="#0e1b2d"/><stop offset="1" stop-color="#070c17"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2=".2"><stop stop-color="#a97832"/><stop offset=".48" stop-color="#fff0bf"/><stop offset="1" stop-color="#c89a4a"/></linearGradient>
 <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c8ffff"/><stop offset=".5" stop-color="#54e2ed"/><stop offset="1" stop-color="#597cff"/></linearGradient>
 <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172d43"/><stop offset="1" stop-color="#0c1829"/></linearGradient>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8ab1ce" stroke-opacity=".07"/></pattern>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#56dce7"/></marker>
 <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#d6b66f"/></marker>
 <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
</defs>
<rect width="1600" height="1000" rx="26" fill="url(#bg)"/><rect width="1600" height="1000" rx="26" fill="url(#grid)"/>
<!-- framing and title -->
<g fill="none" stroke="url(#gold)" stroke-opacity=".45"><path d="M44 78V42H80M1520 42H1556V78M44 922V958H80M1520 958H1556V922"/><circle cx="800" cy="485" r="355" stroke-dasharray="2 12"/><circle cx="800" cy="485" r="332"/><path d="M800 125V850M440 485H1160" stroke-opacity=".13"/></g>
<text x="82" y="82" fill="url(#gold)" font-family="Georgia,serif" font-size="16" letter-spacing="5">IVANNA / SYSTEM ATLAS / 01</text>
<text x="80" y="138" fill="#f7f4ec" font-family="Georgia,serif" font-size="43">Arquitectura y evidencia</text>
<text x="83" y="171" fill="#9eb7cc" font-family="Arial,sans-serif" font-size="16">Mapa conceptual de módulos · conexiones sujetas a validación por ruta</text>
<!-- connector lines behind cards -->
<g fill="none" stroke="#56dce7" stroke-width="2.2" stroke-opacity=".9" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round">
 <path d="M800 370V305H330V332"/><path d="M800 370V305H1270V332"/>
 <path d="M330 475V530H800V575"/><path d="M1270 475V530H800"/>
 <path d="M800 710V752H375V785"/><path d="M800 710V752H1225V785"/>
</g>
<g fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-dasharray="6 7" marker-end="url(#arrowGold)"><path d="M1225 870H1410V912"/><path d="M800 710V730H1410V912"/></g>
<!-- top cards -->
<g font-family="Arial,sans-serif">
 <rect x="105" y="332" width="450" height="143" rx="20" fill="url(#card)" stroke="#56dce7" stroke-opacity=".8"/>
 <circle cx="148" cy="374" r="17" fill="#56dce7" fill-opacity=".12" stroke="#56dce7"/><path d="M140 368H156V380H140Z M143 364H153" fill="none" stroke="#9af7fa" stroke-width="1.4"/>
 <text x="180" y="380" fill="#f4fbff" font-size="24" font-weight="700">Aplicación Android</text><text x="140" y="416" fill="#b7cbd9" font-size="16">Kotlin · Jetpack Compose · JNI</text><text x="140" y="447" fill="#5edce7" font-size="13" letter-spacing="1.7">INTERFAZ Y ORQUESTACIÓN</text>
 <rect x="1045" y="332" width="450" height="143" rx="20" fill="url(#card)" stroke="#56dce7" stroke-opacity=".8"/>
 <circle cx="1088" cy="374" r="17" fill="#56dce7" fill-opacity=".12" stroke="#56dce7"/><path d="M1078 374H1083L1087 365L1093 383L1098 374H1102" fill="none" stroke="#9af7fa" stroke-width="1.4"/>
 <text x="1120" y="380" fill="#f4fbff" font-size="24" font-weight="700">Medición acústica</text><text x="1080" y="416" fill="#b7cbd9" font-size="16">Tonos · captura · comparación</text><text x="1080" y="447" fill="#5edce7" font-size="13" letter-spacing="1.5">MICRÓFONO Y SEÑALES DE PRUEBA</text>
