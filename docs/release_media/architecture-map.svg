 <text x="920" y="304" fill="#bdd0df" font-size="15">Tonos de prueba · captura · comparación</text><text x="920" y="329" fill="#75dce6" font-size="13">RESULTADOS DEPENDEN DEL DISPOSITIVO</text>
 <rect x="470" y="245" width="460" height="125" rx="20" fill="#13273a" stroke="url(#gold)" stroke-width="1.5"/>
 <circle cx="700" cy="278" r="23" fill="none" stroke="url(#gold)" stroke-width="1.4"/><circle cx="700" cy="278" r="14" fill="none" stroke="#5adce8" stroke-opacity=".8"/><path d="M682 278H718M700 260V296" stroke="#d8b46a" stroke-opacity=".8"/>
