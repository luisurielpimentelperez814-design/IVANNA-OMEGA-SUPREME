 <rect x="90" y="630" width="480" height="112" rx="18" fill="url(#panel)" stroke="#a4a8ff" stroke-opacity=".9"/>
 <text x="120" y="666" fill="#eff0ff" font-size="21" font-weight="700">Visualización espacial / FotoHolo</text><text x="120" y="697" fill="#c1c6df" font-size="15">Render geométrico · captura AR experimental</text><text x="120" y="721" fill="#b3b0ff" font-size="13">NO EQUIVALE A HOLOGRAFÍA ÓPTICA EN EL AIRE</text>
 <rect x="830" y="630" width="480" height="112" rx="18" fill="#241f1b" stroke="#d8ad61" stroke-width="1.5" stroke-dasharray="8 6"/>
 <text x="860" y="666" fill="url(#gold)" font-size="21" font-weight="700">HAL / PAL / ASRC del proveedor</text><text x="860" y="697" fill="#dfcdb5" font-size="15">Punto de integración de bajo nivel</text><text x="860" y="721" fill="#f0b9a1" font-size="13">CONTROL FÍSICO NO DEMOSTRADO EN MOTO G85</text>
