 <rect x="520" y="370" width="560" height="340" rx="28" fill="#0a1627" stroke="url(#gold)" stroke-width="1.5"/>
 <rect x="535" y="385" width="530" height="310" rx="20" fill="none" stroke="#d7b66b" stroke-opacity=".25"/>
 <circle cx="800" cy="458" r="54" fill="#55e1ec" fill-opacity=".08" stroke="url(#gold)" stroke-width="1.3"/>
 <circle cx="800" cy="458" r="39" fill="none" stroke="#5be3ed" stroke-opacity=".8"/><circle cx="800" cy="458" r="22" fill="none" stroke="url(#gold)"/>
 <path d="M800 397V519M739 458H861M757 415L843 501M843 415L757 501" stroke="#e7d19a" stroke-opacity=".65"/>
 <circle cx="800" cy="458" r="5" fill="#fff2c8"/>
 <text x="800" y="552" text-anchor="middle" fill="#fff4d4" font-family="Georgia,serif" font-size="27">Cadena propia de reproducción</text>
 <text x="800" y="585" text-anchor="middle" fill="#bed1df" font-size="16">Decodificación · procesamiento · AudioTrack</text>
 <path d="M610 610H990" stroke="url(#gold)" stroke-opacity=".5"/>
 <text x="800" y="638" text-anchor="middle" fill="#5de1eb" font-size="14" letter-spacing="1.8">SOLO EL AUDIO QUE REPRODUCE IVANNA</text>
 <text x="800" y="668" text-anchor="middle" fill="#9db1c4" font-size="13">No implica procesar el audio de otras aplicaciones</text>
 <!-- DSP -->
 <rect x="565" y="575" width="470" height="135" rx="18" fill="#11263b" fill-opacity=".98" stroke="#5adce8" stroke-opacity=".65"/>
 <text x="800" y="613" text-anchor="middle" fill="#f0fbff" font-size="23" font-weight="700">Motor nativo C++ / DSP</text><text x="800" y="642" text-anchor="middle" fill="#bdd0df" font-size="15">JNI · etapas según la cadena conectada</text><text x="800" y="675" text-anchor="middle" fill="#73dfe7" font-size="13" letter-spacing="1.4">VERIFICAR ACTIVACIÓN POR RUTA</text>
 <!-- lower cards -->
 <rect x="105" y="785" width="540" height="112" rx="18" fill="url(#card)" stroke="#a4a5ff" stroke-opacity=".9"/>
 <text x="140" y="824" fill="#f0f0ff" font-size="22" font-weight="700">Visualización espacial / FotoHolo</text><text x="140" y="855" fill="#c3c6df" font-size="15">Render geométrico · captura AR experimental</text><text x="140" y="878" fill="#b3b3ff" font-size="12" letter-spacing="1.2">NO ES HOLOGRAFÍA ÓPTICA EN EL AIRE</text>
 <rect x="955" y="785" width="540" height="112" rx="18" fill="#241f1b" stroke="#d8ad61" stroke-width="1.5" stroke-dasharray="8 6"/>
 <text x="990" y="824" fill="url(#gold)" font-size="22" font-weight="700">HAL / PAL / ASRC del proveedor</text><text x="990" y="855" fill="#dfcdb5" font-size="15">Punto de integración de bajo nivel</text><text x="990" y="878" fill="#f0b9a1" font-size="12" letter-spacing="1.1">CONTROL FÍSICO NO DEMOSTRADO EN MOTO G85</text>
</g>
<!-- legend -->
<g font-family="Arial,sans-serif" font-size="13"><circle cx="108" cy="225" r="5" fill="#55e1ec"/><text x="124" y="230" fill="#bfd0df">Área presente en el proyecto</text><circle cx="390" cy="225" r="5" fill="#b1a8ff"/><text x="406" y="230" fill="#bfd0df">Módulo experimental</text><circle cx="650" cy="225" r="5" fill="#d8ad61"/><text x="666" y="230" fill="#bfd0df">Integración no validada físicamente</text></g>
<text x="80" y="940" fill="#9bb0c5" font-family="Arial,sans-serif" font-size="13">Las flechas indican relaciones funcionales generales; no certifican que todas las etapas estén activas en cada ruta o dispositivo.</text>
<text x="1520" y="940" text-anchor="end" fill="url(#gold)" font-family="Georgia,serif" font-style="italic" font-size="14">Rigor antes que promesas.</text>
</svg>