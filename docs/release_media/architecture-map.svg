<text x="64" y="870" fill="#d9bf8f" font-size="20" letter-spacing="2">OBSERVAR Y CONTRASTAR</text>
<text x="64" y="918" fill="#edf0ee" font-size="28">Medición acústica</text><text x="640" y="918" fill="#edf0ee" font-size="28">Captura AR / geometría</text>
<text x="64" y="956" fill="#b8c9cb" font-size="23">Capturar · comparar · aceptar o restaurar.</text><text x="640" y="956" fill="#b8c9cb" font-size="23">Puntos espaciales · exportación · render.</text>
