 <circle cx="126" cy="265" r="12" fill="#5adce8" fill-opacity=".17" stroke="#5adce8"/><text x="151" y="270" fill="#effbff" font-size="21" font-weight="700">Aplicación Android</text>
 <text x="120" y="304" fill="#bdd0df" font-size="15">Kotlin · Jetpack Compose · servicios y puentes</text><text x="120" y="329" fill="#75dce6" font-size="13">INTERFAZ / ORQUESTACIÓN</text>
