 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f7d98b"/><stop offset=".5" stop-color="#fff0bf"/><stop offset="1" stop-color="#c58b32"/></linearGradient>
 <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172b42"/><stop offset="1" stop-color="#101d30"/></linearGradient>
 <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#5adce8"/></marker>
 <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#d9b76b"/></marker>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#89a9c5" stroke-opacity=".075" stroke-width="1"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="5"/></filter>
