<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">IVANNA OMEGA SUPREME — atlas de arquitectura</title>
<desc id="desc">Mapa visual de las áreas Android, reproducción propia, motor DSP nativo, medición acústica y visualización espacial. Las conexiones son conceptuales; HAL y el control de hardware se muestran como no verificados.</desc>
<defs>
