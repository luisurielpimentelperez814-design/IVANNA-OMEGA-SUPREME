<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1100" viewBox="0 0 1200 1100" role="img" aria-labelledby="title desc">
<title id="title">IVANNA — Rutas y alcance</title>
<desc id="desc">Mapa funcional. El reproductor Android procesa su audio hacia AudioTrack. Efectos Android y Magisk dependen de capacidades e integración. El dashboard distingue configuración local y demostración. Medición y AR requieren validación física.</desc>
