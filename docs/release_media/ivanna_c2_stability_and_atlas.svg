      <text x="198" y="122" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="9">Dereverb Cola + Des-enmascarado</text>

      <rect x="376" y="92" width="176" height="38" rx="7" fill="#0D1B33" stroke="#38BDF8" stroke-width="1"/>
