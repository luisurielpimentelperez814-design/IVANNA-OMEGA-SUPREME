      <text x="198" y="30" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="9">Cinta Par T₂ · Sala Íntima</text>

      <rect x="376" y="0" width="176" height="38" rx="7" fill="#0D1B33" stroke="#A97FFF" stroke-width="1"/>
      <text x="386" y="16" fill="#A97FFF" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700">02 · NEO-SOUL / R&amp;B</text>
      <text x="386" y="30" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="9">Sub-Grave Sólido · Voz Cerca</text>

