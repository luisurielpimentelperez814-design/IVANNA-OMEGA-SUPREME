      <rect x="376" y="138" width="176" height="38" rx="7" fill="#0D1B33" stroke="#A78BFA" stroke-width="1"/>
      <text x="386" y="154" fill="#A78BFA" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700">11 · PODCAST / VOICE</text>
