    <!-- Atlas Pipeline Flow inside Right Panel -->
    <rect x="22" y="262" width="552" height="162" rx="10" fill="#0B162B" stroke="#1E293B" stroke-width="1.2"/>
    <text x="36" y="286" fill="#FFD166" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">CADENA MATEMÁTICA DEL ATLAS DE ESCENA (CERO INTERVENCIONES MANUALES):</text>
    <text x="36" y="308" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="12">1. <tspan fill="#00F0FF" font-weight="700">IvannaAudioClassifier (IVW1)</tspan>: Carga 8 774 pesos verificados y extrae vector 12-D por ventana.</text>
    <text x="36" y="329" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="12">2. <tspan fill="#A97FFF" font-weight="700">StyleBlender</tspan>: Calcula distancia Mahalanobis diagonal, Softmax (T=0.55), EMA (τ=2.0s) y</text>
    <text x="52" y="347" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="11.5">confianza de entropía normalizada c = 1 + Σ p_k ln(p_k)/ln(12) con rampa [0.25, 0.55].</text>
    <text x="36" y="368" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="12">3. <tspan fill="#23F09A" font-weight="700">SceneTargetBus</tspan>: Publica SceneTarget (64B alignas) vía palabra de estado atómica CAS (1 byte).</text>
    <text x="36" y="389" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="12">4. <tspan fill="#FF2E93" font-weight="700">Motores Físicos RT</tspan>: LateReverbSuppressor (185 Hz 3-pole) + PhysicalEarlyReflections (6 paredes)</text>
    <text x="52" y="407" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="11.5">+ HarmonicRichnessController (polinomios de Chebyshev T₂, T₃, T₄ con bloqueo DC).</text>
