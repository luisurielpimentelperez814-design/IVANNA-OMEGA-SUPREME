      <text x="10" y="62" fill="#23F09A" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700">03 · ELECTRONIC / IDM</text>
      <text x="10" y="76" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="9">Width 1.38x · Transiente Puro</text>

      <rect x="188" y="46" width="176" height="38" rx="7" fill="#0D1B33" stroke="#38BDF8" stroke-width="1"/>
      <text x="198" y="62" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700">04 · SYMPHONIC HALL</text>
      <text x="198" y="76" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="9">Sala #169 · RT60 0.86s · HOA4</text>

      <rect x="376" y="46" width="176" height="38" rx="7" fill="#0D1B33" stroke="#F472B6" stroke-width="1"/>
      <text x="386" y="62" fill="#F472B6" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700">05 · JAZZ QUARTET</text>
      <text x="386" y="76" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="9">ER 6 Paredes · Micro-Paralaje</text>

      <rect x="0" y="92" width="176" height="38" rx="7" fill="#0D1B33" stroke="#FF2E93" stroke-width="1"/>
      <text x="10" y="108" fill="#FF2E93" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700">06 · HIP-HOP SUB-808</text>
      <text x="10" y="122" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="9">185Hz 3-Pole Protect · Punch</text>

      <rect x="188" y="92" width="176" height="38" rx="7" fill="#0D1B33" stroke="#FB923C" stroke-width="1"/>
