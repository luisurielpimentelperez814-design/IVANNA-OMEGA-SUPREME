    <text x="22" y="30" fill="#00F0FF" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="800">B · ATLAS DE ESCENA MUSICAL (IvannaMusicIntelligenceEngine v2.4.0)</text>
    <text x="22" y="50" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10.5">12 Centroides Acústicos · Pesos IVW1 (8 774 params) · StyleBlender · Triple-Buffer Lock-Free</text>

    <!-- 12 Styles Grid (3 columns x 4 rows) -->
    <g transform="translate(22, 68)">
      <rect x="0" y="0" width="176" height="38" rx="7" fill="#0D1B33" stroke="#00F0FF" stroke-width="1"/>
      <text x="10" y="16" fill="#00F0FF" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700">00 · PROG ROCK 70s</text>
      <text x="10" y="30" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="9">RT60 0.42s · T₂/T₃ Analógico</text>

      <rect x="188" y="0" width="176" height="38" rx="7" fill="#0D1B33" stroke="#FFD166" stroke-width="1"/>
