name: build-ivanna-asrcd
# Produce system/bin/ivanna_asrcd (aarch64) y lo publica en el release.
# El entorno de trabajo no tiene cross-toolchain ni red: este job es la unica
# via por la que el binario del daemon nuevo llega al telefono.
on:
  workflow_dispatch:
  push:
    paths:
      - 'engine/**'
      - '.github/workflows/build-asrcd.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar NDK r27
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973" || true
          NDK="${ANDROID_HOME}/ndk/27.0.12077973"
          echo "NDK=$NDK" >> $GITHUB_ENV
          echo "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Compilar ivanna_asrcd (aarch64, API 29)
        run: |
          aarch64-linux-android29-clang++ -O2 -std=c++17 -fPIE -pie \
            -static-libstdc++ \
            -Iengine \
            engine/asrc/ivanna_asrc_core.cpp \
            engine/asrc/ivanna_asrc_ipc.cpp \
            engine/asrcd/ivanna_servo.cpp \
            engine/asrcd/ivanna_asrcd.cpp \
            -o system/bin/ivanna_asrcd
          chmod 0755 system/bin/ivanna_asrcd
          file system/bin/ivanna_asrcd
          sha256sum system/bin/ivanna_asrcd

      - name: Compilar y ejecutar la suite host (debe dar 25/25)
        run: |
          g++ -O2 -std=c++17 -Iengine \
            engine/asrc/ivanna_asrc_core.cpp engine/asrc/ivanna_asrc_ipc.cpp \
            engine/asrcd/ivanna_servo.cpp engine/effect/ivanna_asrc_bridge.cpp \
            tests/test_ivanna_asrc.cpp -o ivanna_asrc_tests
          ./ivanna_asrc_tests | tee suite.log
          grep -q "0 fallan" suite.log

      - uses: actions/upload-artifact@v4
        with:
          name: ivanna_asrcd-aarch64
          path: system/bin/ivanna_asrcd
