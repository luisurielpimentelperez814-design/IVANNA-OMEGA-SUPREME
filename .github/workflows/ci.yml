name: IVANNA OMEGA SUPREME CI

on:
  push:
    branches:
      - main
      - validation/world-benchmark
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_COMPILE_SDK: 35
  ANDROID_BUILD_TOOLS: 35.0.0
  ANDROID_NDK_VERSION: 26.1.10909125

jobs:

  android-build:

    name: Android ARM64 Build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17


      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: ${{ env.ANDROID_COMPILE_SDK }}
          build-tools: ${{ env.ANDROID_BUILD_TOOLS }}
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}


      - name: Gradle Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug \
          --no-daemon \
          --stacktrace


      - name: Native library audit
        run: |
          find app/build -name "*.so"


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ivanna-debug-apk
          path: app/build/outputs/apk/**/*.apk


  cpp-analysis:

    name: Native C++ Audit
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt update
          sudo apt install -y cppcheck clang


      - name: CPPCheck
        run: |
          cppcheck \
          --enable=warning,performance,portability \
          --std=c++17 \
          app/src/main/cpp || true


  magisk-validation:

    name: Magisk Module Validation
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4


      - name: Validate files
        run: |

          test -f magisk_module/module.prop
          test -f magisk_module/service.sh

          bash -n magisk_module/*.sh


      - name: XML validation
        run: |

          sudo apt install -y libxml2-utils

          find magisk_module \
          -name "*.xml" \
          -exec xmllint --noout {} \;


