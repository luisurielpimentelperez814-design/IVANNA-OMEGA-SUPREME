name: IVANNA-OMEGA-SUPREME CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omega-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_COMPILE_SDK: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  ANDROID_NDK_VERSION: "26.1.10909125"
  ANDROID_CMAKE_VERSION: "3.22.1"
  CMDLINE_TOOLS_VERSION: "11076708"
  GRADLE_VERSION: "8.9"

jobs:

  test-native-dsp:
    name: DSP Native Tests (host, CTest)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: Configure (Release)
        run: cmake -B build-tests -S app/src/main/cpp/tests -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-tests -j
      - name: Run tests
        run: ctest --test-dir build-tests --output-on-failure

  build-apk:
    name: Build APK & Native Binaries
    runs-on: ubuntu-22.04
    needs: [test-native-dsp]
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ─────────────────────────────────────────────────────────────────
      # AUDIT FIX (CI 503): la URL por defecto del wrapper
      # (services.gradle.org/distributions) a veces devuelve 503
      # intermitente. En vez de usar ./gradlew directo, descargamos la
      # distribución con reintentos y mirror a la CDN oficial de Gradle
      # (releases.gradle.org) ANTES de invocar el build, y cacheamos la
      # carpeta para no volver a bajarla.
      # ─────────────────────────────────────────────────────────────────
      - name: Cache Gradle distribution
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-${{ env.GRADLE_VERSION }}-${{ runner.os }}

      - name: Provision Gradle (retry + mirror)
        run: |
          set -euo pipefail
          GRADLE_HOME_DIR="$HOME/.gradle-dist"
          mkdir -p "$GRADLE_HOME_DIR"
          ZIP="$GRADLE_HOME_DIR/gradle-${GRADLE_VERSION}-bin.zip"
          URLS=(
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
            "https://downloads.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
            "https://releases.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          )
          ok=0
          for attempt in 1 2 3 4 5; do
            for url in "${URLS[@]}"; do
              echo "[gradle-provision] attempt $attempt → $url"
              if curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors \
                       --connect-timeout 30 --max-time 300 \
                       -o "$ZIP" "$url"; then
                ok=1; break
              fi
              sleep $((attempt * 2))
            done
            [ "$ok" = "1" ] && break
          done
          [ "$ok" = "1" ] || { echo "ERROR: no se pudo descargar Gradle"; exit 1; }
          unzip -q -o "$ZIP" -d "$GRADLE_HOME_DIR"
          echo "GRADLE_HOME=$GRADLE_HOME_DIR/gradle-${GRADLE_VERSION}" >> "$GITHUB_ENV"
          echo "$GRADLE_HOME_DIR/gradle-${GRADLE_VERSION}/bin"          >> "$GITHUB_PATH"

      - name: Install Android SDK (manual)
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors \
               -o tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_TOOLS_VERSION}_latest.zip"
          unzip -q tools.zip
          rm tools.zip
          mv cmdline-tools latest
          SDKMGR="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "platforms;android-${ANDROID_COMPILE_SDK}" \
                    "build-tools;${ANDROID_BUILD_TOOLS}" \
                    "ndk;${ANDROID_NDK_VERSION}" \
                    "cmake;${ANDROID_CMAKE_VERSION}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT"     >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools"            >> "$GITHUB_PATH"

      - name: Generate local.properties
        run: printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties

      - name: Remove Termux aapt2 override from Gradle cache
        run: |
          GRADLE_PROPS="$HOME/.gradle/gradle.properties"
          if [ -f "$GRADLE_PROPS" ]; then
            sed -i '/aapt2FromMavenOverride/d' "$GRADLE_PROPS"
            echo "Cleaned aapt2FromMavenOverride from $GRADLE_PROPS"
          fi
          sed -i '/aapt2FromMavenOverride/d' gradle.properties 2>/dev/null || true

      - name: Build APK (Gradle provisto localmente)
        run: |
          chmod +x gradlew
          # Usar el gradle provisionado manualmente (no el wrapper, para
          # evitar re-descarga ante 503 transitorios).
          gradle assembleDebug --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC" \
            -Dorg.gradle.caching=true \
            -Dorg.gradle.parallel=true

      - name: Verify artifacts
        run: |
          set -euo pipefail
          # APK debug debe existir
          ls -lh app/build/outputs/apk/debug/*.apk
          # Binarios nativos: no basta con listarlos — si falta alguno, el
          # build esta roto aunque Gradle haya terminado en verde. El daemon
          # (ivanna_daemon) y el efecto (libomega_effect.so) son los dos
          # artefactos que el modulo Magisk necesita en el dispositivo.
          DAEMON=$(find app/build/intermediates -name "ivanna_daemon" -type f | head -1)
          EFFECT=$(find app/build/intermediates -name "libomega_effect.so" -type f | head -1)
          test -n "$DAEMON" || { echo "ERROR: ivanna_daemon no compilado"; exit 1; }
          test -n "$EFFECT" || { echo "ERROR: libomega_effect.so no compilado"; exit 1; }
          echo "daemon: $DAEMON"
          echo "effect: $EFFECT"
          file "$DAEMON" | grep -q "ELF 64-bit" || { echo "ERROR: daemon no es ELF arm64"; exit 1; }
          file "$EFFECT" | grep -q "ELF 64-bit" || { echo "ERROR: effect no es ELF arm64"; exit 1; }
          # El POST_BUILD del daemon copia el binario al staging del modulo;
          # sin esta copia el zip sale sin daemon y el socket no arranca.
          test -f magisk_module/system/bin/ivanna_daemon || { echo "ERROR: daemon no stageado en magisk_module/system/bin"; exit 1; }
          test -f magisk_module/system/vendor/lib64/soundfx/libomega_effect.so || { echo "ERROR: libomega_effect.so no stageado en soundfx"; exit 1; }

      - name: Package Magisk module
        run: |
          set -euo pipefail
          test -f magisk_module/sepolicy.rule || { echo "ERROR: falta sepolicy.rule"; exit 1; }
          if grep -vE '^[[:space:]]*#|^[[:space:]]*$' magisk_module/sepolicy.rule | grep -qE '^[[:space:]]*(type|attribute|typeattribute|allowxperm|neverallow|require)[[:space:]]'; then
            echo "ERROR: sepolicy.rule usa sintaxis .te (: o ;)"; exit 1
          fi
          cd magisk_module
          zip -r "$GITHUB_WORKSPACE/ivanna_omega_supreme.zip" . -x "*.git*"
          cd "$GITHUB_WORKSPACE"
          unzip -l ivanna_omega_supreme.zip | grep -q "system/bin/ivanna_daemon" || { echo "ERROR: zip sin daemon"; exit 1; }
          unzip -l ivanna_omega_supreme.zip | grep -q "sepolicy.rule"            || { echo "ERROR: zip sin sepolicy.rule"; exit 1; }
          ls -lh ivanna_omega_supreme.zip

      - name: Upload Magisk module + binaries
        uses: actions/upload-artifact@v4
        with:
          name: ivanna-magisk-module
          path: |
            ivanna_omega_supreme.zip
            magisk_module/system/bin/ivanna_daemon
            magisk_module/system/vendor/lib64/soundfx/libomega_effect.so
          if-no-files-found: error
          overwrite: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ivanna-omega-apk-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          overwrite: true
