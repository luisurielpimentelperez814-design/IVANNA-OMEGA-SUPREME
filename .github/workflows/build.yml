name: IVANNA-OMEGA-SUPREME CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      broadcast_release:
        description: "Send release announcements to configured social channels"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  # Aislar por SHA evita que un build viejo/lento bloquee la validación del HEAD.
  # publish-release conserva su propio grupo serializado para evitar carreras al publicar.
  group: omega-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  ANDROID_COMPILE_SDK: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  ANDROID_NDK_VERSION: "27.2.12479018"
  ANDROID_CMAKE_VERSION: "3.30.3"
  CMDLINE_TOOLS_VERSION: "11076708"
  GRADLE_VERSION: "8.9"

jobs:

  test-native-dsp:
    name: DSP Native Tests (host, CTest)
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: Install HDF5 validator
        run: python3 -m pip install --disable-pip-version-check h5py numpy
      - name: Validate every SOFA with a real HDF5 reader
        run: python3 scripts/validate_sofa_hdf5.py .
      - name: SOFA validator regression tests
        run: python3 -m unittest discover -s tests -p 'test_validate_sofa_hdf5.py' -v
      - name: AutoEqManager Kotlin profiles match freshly measured HpIR corpus
        run: python3 -m unittest discover -s tests -p 'test_autoeq_kotlin_matches_extractor.py' -v
      - name: SAFMUS transversal wiring contract
        run: python3 scripts/check_safmus_transversal_wiring.py
      - name: SAFMUS sync/ASRC numerical reference self-test
        run: python3 sync_asrc.py --self-test
      - name: SAFMUS sync/ASRC regression tests
        run: python3 -m unittest discover -s tests -p 'test_sync_asrc.py' -v
      - name: Adversarial audio measurement regression suite
        run: python3 -m unittest discover -s tests -p 'test_ivanna_audio_certify.py' -v
      - name: Synthetic signal fault-injection suite
        run: python3 -m unittest discover -s tests -p 'test_ivanna_synthetic_audio_suite.py' -v
      - name: Auditory magnificence gate policy tests
        run: python3 -m unittest discover -s tests -p 'test_ivanna_auditory_gate.py' -v
      - name: Configure (Release)
        run: cmake -B build-tests -S app/src/main/cpp/tests -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-tests -j4
      - name: Run tests
        run: |
          set -o pipefail
          rc=0
          ctest --test-dir build-tests --output-on-failure 2>&1 | tee ctest_last.log || rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            fails=$(grep -E "^\s*[0-9]+ - .*\((Failed|Timeout|SEGFAULT|Subprocess aborted|Exception)" ctest_last.log | sed 's/^ *//' | tr '\n' ';' | cut -c1-600)
            detail=$(grep -E "Failure|Expected|Actual|which is|SUMMARY:|medido:" ctest_last.log | head -8 | tr '\n' ' ' | cut -c1-700)
            echo "::error title=DSP CTest fallido::${fails} | ${detail}"
          fi
          exit $rc

  build-apk:
    name: Build APK & Native Binaries (artifact integrity enforced)
    runs-on: ubuntu-22.04
    needs: [test-native-dsp]
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node for the embedded FotoHolo WebGL bundle
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Build and stage the standalone FotoHolo WebGL bundle
        run: |
          set -euo pipefail
          npm install --global npm@11.19.0
          npm ci
          npm run lint
          npm run test:web
          npm run build
          npx vite build --config vite.fotoholo.config.ts
          test -s dist-fotoholo/fotoholo-embed.html
          rm -rf app/src/main/assets/fotoholo-web
          mkdir -p app/src/main/assets/fotoholo-web
          cp dist-fotoholo/fotoholo-embed.html app/src/main/assets/fotoholo-web/
          cp -R dist-fotoholo/assets app/src/main/assets/fotoholo-web/assets

      # ═══════════════════════════════════════════════════════════════════
      # ARTIFACT INTEGRITY (auditoría 2026-08-16)
      # El zip Magisk distribuido contenía un ivanna_daemon ARM32 / NDK r25b
      # antiguo (BuildID 7a92e8...) en lugar del ARM64 recién compilado.
      # Causa: staging condicional ("if [ -f ] cp") que copiaba binarios
      # versionados/residuales cuando la compilación no dejaba el artefacto
      # en la ruta esperada. Política nueva:
      #   1. PURGA total antes de compilar (ningún binario preexistente).
      #   2. Compilación obligatoria desde fuente — si no produce binario,
      #      el job FALLA (test -f || exit 1). Nunca se copia "lo que haya".
      #   3. Validación estricta: file → 64-bit LSB arm64, readelf →
      #      AArch64 + DYN (PIE), sha256 registrado.
      #   4. Manifiesto BUILD_INFO dentro del módulo.
      #   5. Validación post-zip: el daemon extraído del zip debe tener
      #      hash idéntico al compilado.
      #   6. Artefacto versionado por SHA: ivanna-magisk-module-arm64-<sha>.
      # ═══════════════════════════════════════════════════════════════════

      - name: Purge any prebuilt/committed binaries (anti-contamination)
        run: |
          set -euo pipefail
          rm -f magisk_module/system/bin/ivanna_daemon
          rm -f ivanna_daemon
          rm -f extracted_daemon
          # FIX (CI exit 1): GNU find con -delete activa -depth implicitamente,
          # y con -depth activo el -prune deja de funcionar -> find aborta con
          # "The -delete action automatically turns on -depth, but -prune does
          # nothing when -depth is in effect" y el job moria ANTES de compilar.
          # La exclusion de .git se hace con -not -path (no requiere prune).
          find . -not -path "./.git/*" -name "*.so" -type f -print -delete
          find . -not -path "./.git/*" -name "ivanna_daemon" -type f -print -delete
          echo "Purge OK — repo contiene solo fuentes"

      - name: Cache Gradle distribution
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-${{ env.GRADLE_VERSION }}-${{ runner.os }}

      - name: Provision Gradle (retry + mirror)
        run: |
          set -euo pipefail
          GRADLE_HOME_DIR="$HOME/.gradle-dist"
          mkdir -p "$GRADLE_HOME_DIR"
          ZIP="$GRADLE_HOME_DIR/gradle-${GRADLE_VERSION}-bin.zip"
          URLS=(
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
            "https://downloads.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
            "https://releases.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          )
          ok=0
          for attempt in 1 2 3 4 5; do
            for url in "${URLS[@]}"; do
              echo "[gradle-provision] attempt $attempt → $url"
              if curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors \
                       --connect-timeout 30 --max-time 300 -o "$ZIP" "$url"; then
                ok=1; break
              fi
              sleep $((attempt * 2))
            done
            [ "$ok" = "1" ] && break
          done
          [ "$ok" = "1" ] || { echo "ERROR: no se pudo descargar Gradle"; exit 1; }
          unzip -q -o "$ZIP" -d "$GRADLE_HOME_DIR"
          echo "GRADLE_HOME=$GRADLE_HOME_DIR/gradle-${GRADLE_VERSION}" >> "$GITHUB_ENV"
          echo "$GRADLE_HOME_DIR/gradle-${GRADLE_VERSION}/bin"          >> "$GITHUB_PATH"

      - name: Install Android SDK + NDK (retry corrupted Google SDK archives)
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors \
               -o tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_TOOLS_VERSION}_latest.zip"
          unzip -tq tools.zip
          unzip -q tools.zip && rm tools.zip && mv cmdline-tools latest
          SDKMGR="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true

          # sdkmanager can receive a truncated NDK archive from Google's mirror.
          # Install packages separately, retrying and deleting only the partial
          # package download/cache between attempts.
          install_package() {
            local package="$1" attempt
            for attempt in 1 2 3 4 5; do
              echo "[sdkmanager] attempt ${attempt}/5: ${package}"
              if "$SDKMGR" --install "$package"; then return 0; fi
              echo "::warning::sdkmanager failed for ${package}; clearing partial downloads before retry"
              rm -rf "$ANDROID_SDK_ROOT/temp" "$ANDROID_SDK_ROOT/.temp"
              sleep "$((attempt * 3))"
            done
            echo "::error::Failed to install Android SDK package after 5 attempts: ${package}"
            return 1
          }
          install_package "platform-tools"
          install_package "platforms;android-${ANDROID_COMPILE_SDK}"
          install_package "build-tools;${ANDROID_BUILD_TOOLS}"
          install_package "cmake;${ANDROID_CMAKE_VERSION}"
          install_package "ndk;${ANDROID_NDK_VERSION}"

          test -f "$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}/build/cmake/android.toolchain.cmake"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT"     >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools"            >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/cmake/${ANDROID_CMAKE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Generate local.properties
        run: printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties

      - name: Remove Termux aapt2 override from Gradle cache
        run: |
          GRADLE_PROPS="$HOME/.gradle/gradle.properties"
          if [ -f "$GRADLE_PROPS" ]; then
            sed -i '/aapt2FromMavenOverride/d' "$GRADLE_PROPS"
          fi
          sed -i '/aapt2FromMavenOverride/d' gradle.properties 2>/dev/null || true

      # ── COMPILACIÓN DEL DAEMON (obligatoria, desde fuente) ────────────
      - name: Compile ivanna_daemon from source (NDK r27d, C++26, arm64-v8a)
        run: |
          set -euo pipefail
          NDK="$ANDROID_NDK_HOME"
          TC="$NDK/build/cmake/android.toolchain.cmake"
          test -f "$TC" || { echo "ERROR: toolchain NDK no encontrado en $TC"; exit 1; }
          cmake -B build-daemon -S app/src/main/cpp/daemon \
            -DCMAKE_TOOLCHAIN_FILE="$TC" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-27 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,-z,relro -Wl,-z,now -Wl,--enable-new-dtags" \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF
          cmake --build build-daemon -j --config Release
          # Localizar el binario producido — DEBE existir, nunca copiar otra cosa
          DAEMON_BIN_PATH=$(find build-daemon -name "ivanna_daemon" -type f | head -1)
          test -n "$DAEMON_BIN_PATH" || { echo "ERROR: la compilación no produjo ivanna_daemon"; exit 1; }
          cp "$DAEMON_BIN_PATH" ./ivanna_daemon
          chmod 755 ./ivanna_daemon

      - name: Compile ivanna_client (NDK r26, arm64-v8a)
        run: |
          set -euo pipefail
          CXX="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang"
          test -x "$CXX" || { echo "ERROR: clang NDK no encontrado"; exit 1; }
          "$CXX" -std=c11 -O2 -pie -fPIE -fstack-protector-strong \
            -D_FORTIFY_SOURCE=2 -Wl,-z,relro,-z,now -Wl,--build-id=sha1 \
            app/src/main/cpp/daemon/ivanna_client.c -o ivanna_client
          chmod 755 ivanna_client
          file ivanna_client | grep -qiE "aarch64|arm64" || { echo "ERROR: no ARM64"; exit 1; }
          sha256sum ivanna_client
          mkdir -p magisk_module/system/bin
          cp ivanna_client magisk_module/system/bin/ivanna_client
          echo "ivanna_client OK"

      # ── VALIDACIÓN ESTRICTA DEL BINARIO COMPILADO ──────────────────────
      - name: Validate daemon ELF (arm64 / AArch64 / PIE / hash)
        run: |
          set -euo pipefail
          test -f ivanna_daemon || { echo "ERROR: ivanna_daemon ausente tras compilar"; exit 1; }
          FILE_OUT="$(file ivanna_daemon)"
          echo "$FILE_OUT"
          echo "$FILE_OUT" | grep -q "64-bit"  || { echo "ERROR: daemon no es 64-bit"; exit 1; }
          echo "$FILE_OUT" | grep -qiE "aarch64|arm64" || { echo "ERROR: daemon no es ARM64"; exit 1; }
          READELF=readelf
          command -v "$READELF" >/dev/null 2>&1 || READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          HDR="$("$READELF" -h ivanna_daemon)"
          echo "$HDR"
          echo "$HDR" | grep -q "AArch64"          || { echo "ERROR: readelf no reporta AArch64"; exit 1; }
          echo "$HDR" | grep -qE "Type:.*DYN"       || { echo "ERROR: daemon no es PIE (Type != DYN)"; exit 1; }
          # Hardening: RELRO + BIND_NOW (segmento GNU_RELRO + flag BIND_NOW)
          PH_OUT="$("$READELF" -l -W ivanna_daemon 2>/dev/null || "$READELF" -lW ivanna_daemon 2>/dev/null || "$READELF" --program-headers ivanna_daemon 2>/dev/null || true)"
          echo "$PH_OUT" | grep -qiE "GNU_RELRO|PT_GNU_RELRO" || { echo "ERROR: sin RELRO"; echo "--- Program Headers ---"; echo "$PH_OUT"; exit 1; }
          DYN_OUT="$("$READELF" -d -W ivanna_daemon 2>/dev/null || "$READELF" -dW ivanna_daemon 2>/dev/null || "$READELF" --dynamic-table ivanna_daemon 2>/dev/null || true)"
          echo "$DYN_OUT" | grep -qE "BIND_NOW|FLAGS.*NOW" || { echo "ERROR: sin BIND_NOW"; echo "--- Dynamic Table ---"; echo "$DYN_OUT"; exit 1; }
          # FIX (comprobacion real, no supuesta): el daemon lo lanza Magisk
          # service.sh como root FUERA del sandbox del APK, sin el
          # directorio de librerias nativas en LD_LIBRARY_PATH. Si queda
          # NEEDED contra libc++_shared.so, el proceso muere antes de
          # main() sin escribir ni una linea de log (exactamente el
          # sintoma reportado: modulo ACTIVO, daemon nunca bindea,
          # daemon.log vacio). CMakeLists.txt del daemon fuerza c++_static
          # via -nostdlib++, pero "file" reportando "dynamically linked"
          # NO lo confirma - eso es normal en CUALQUIER PIE (usa
          # /system/bin/linker64 para cargarse a si mismo aunque su C++
          # runtime este estatico). La unica prueba real es el NEEDED
          # explicito de la seccion dinamica:
          NEEDED="$(echo "$DYN_OUT" | grep -i 'NEEDED' || true)"
          echo "$NEEDED"
          echo "$NEEDED" | grep -qi "libc++_shared" && { echo "ERROR: ivanna_daemon depende de libc++_shared.so — se ejecuta fuera del sandbox del APK via Magisk y NO puede resolverla, el proceso moriria antes de bindear el socket"; exit 1; }
          echo "OK: sin dependencia de libc++_shared.so — daemon autocontenido para ejecucion fuera del APK"
          sha256sum ivanna_daemon | tee daemon_sha256.txt

      - name: Provision Android keystores for Release signing
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" "$HOME/.config/.android"
          # Firma ESTABLE: sin ella cada build sale con una llave distinta y Android
          # rechaza actualizar ("app no instalada"). El keystore vive en el secreto.
          if [ -n "${ANDROID_KEYSTORE_B64:-}" ]; then
            printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"
            echo "OK: firma estable desde el secreto ANDROID_KEYSTORE_B64"
          else
            echo "::warning::Sin ANDROID_KEYSTORE_B64: se firma con llave efimera y el APK NO podra actualizar una instalacion previa"
          fi
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" || true
          fi
          cp -f "$HOME/.android/debug.keystore" "$HOME/.config/.android/debug.keystore" || true
          echo "Keystores provisioned:"
          ls -la "$HOME/.android/debug.keystore" "$HOME/.config/.android/debug.keystore"

      - name: Build APK (Gradle provisionado)
        run: |
          chmod +x gradlew
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC" \
            -Dorg.gradle.caching=true 2>&1 | tee gradle_build.log || \
          (echo "Retrying assembleDebug with --refresh-dependencies..." && \
           gradle assembleRelease --no-daemon --stacktrace --refresh-dependencies \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC" 2>&1 | tee gradle_build.log)

      # Gate obligatorio: el release no se publica si fallan las pruebas JVM
      # del APK. Las pruebas host y nativas no sustituyen estas regresiones Android.
      - name: JVM unit tests (gate obligatorio de release)
        run: |
          set -o pipefail
          rc=0
          gradle testReleaseUnitTest --no-daemon --continue \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC" 2>&1 | tee gradle_unit_tests.log || rc=${PIPESTATUS[0]}
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          t = f = e = s = 0
          bad = []
          for p in glob.glob("app/build/test-results/**/*.xml", recursive=True):
              r = ET.parse(p).getroot()
              t += int(r.get("tests", 0)); f += int(r.get("failures", 0)); e += int(r.get("errors", 0)); s += int(r.get("skipped", 0))
              for tc in r.iter("testcase"):
                  if tc.find("failure") is not None or tc.find("error") is not None:
                      bad.append(f"{tc.get('classname')}.{tc.get('name')}")
          print(f"JVM unit tests: {t} ejecutadas, {f} fallos, {e} errores, {s} omitidas")
          for b in bad[:40]:
              print(f"::error title=JVM unit test fallida::{b}")
          PY
          exit $rc

      # Diagnostico: el log de un job fallido solo es legible con sesion en la
      # web; la API de check-runs SI expone las anotaciones. Se publican como
      # ::error:: las lineas de error de compilacion Kotlin/Gradle para poder
      # leer la causa real del rojo sin abrir el log completo.
      - name: Surface Gradle errors as annotations
        if: failure()
        run: |
          [ -f gradle_build.log ] || exit 0
          grep -E -A6 '^e: |Unresolved reference|Type mismatch|What went wrong|Execution failed for task' gradle_build.log \
            | sed 's/\r$//; s/%/%25/g' | head -40 \
            | while IFS= read -r l; do echo "::error::${l:0:400}"; done
          exit 0

      # Diagnóstico R8: los logs de job no son legibles vía API; los avisos de R8 se
      # publican como anotaciones (conteo + únicos) y, si existe, missing_rules.txt.
      - name: Surface R8 warnings as annotations
        if: always()
        run: |
          [ -f gradle_build.log ] || exit 0
          total=$(grep -cE 'R8|r8' gradle_build.log || true)
          echo "::notice title=R8::${total} líneas mencionan R8 en el log de Gradle"
          grep -E 'WARNING: R8|R8:|Missing class|kotlin metadata|Kotlin metadata' gradle_build.log \
            | sed 's/\r$//; s/%/%25/g' | sort -u | head -8 \
            | while IFS= read -r l; do echo "::warning title=R8::${l:0:380}"; done
          M=$(find app/build -name missing_rules.txt 2>/dev/null | head -1)
          if [ -n "$M" ]; then echo "::warning title=R8 missing_rules::$(head -c 900 "$M" | tr '\n' ' ')"; fi
          exit 0

      # ── VALIDACIÓN EXTRA: detectar APK corrupto antes de artifact upload ──
      - name: Validate Gradle APK CRC before staging
        run: |
          set -euo pipefail

          APK_PATH=$(find app/build/outputs/apk -name "*.apk" -type f | head -1)

          test -n "$APK_PATH" || {
            echo "ERROR: no existe APK generado por Gradle"
            exit 1
          }

          echo "APK generado:"
          ls -lh "$APK_PATH"

          echo "Validando ZIP interno:"
          unzip -t "$APK_PATH"

          echo "Validación APK completada"

      # ── STAGING + VALIDACIÓN DEL APK (auditoría 2026-08-16) ────────────
      # FIX: gradle assembleRelease SÍ generaba el APK en app/build/outputs/apk/
      # pero ningún step posterior lo copiaba, validaba, ni lo incluía en
      # el path: del Upload artifacts de más abajo — se compilaba y se
      # descartaba en silencio. Nadie podía descargar un APK actualizado
      # desde un run de CI exitoso pese a que Gradle no fallaba nunca.
      # Mismo nivel de validación que ya se le exige a ivanna_daemon y
      # libomega_effect.so — no "cp si existe", el job muere si falta.
      - name: Stage + validate APK artifact
        run: |
          set -euo pipefail
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" -type f | head -1)
          test -n "$APK_PATH" || { echo "ERROR: gradle assembleRelease no produjo ningún .apk en app/build/outputs/apk/"; exit 1; }
          test -s "$APK_PATH" || { echo "ERROR: $APK_PATH existe pero está vacío (0 bytes)"; exit 1; }
          # Validación real de que es un APK válido, no un archivo corrupto:
          # todo APK es un ZIP y DEBE contener AndroidManifest.xml en la raíz.
          unzip -l "$APK_PATH" | grep -q "AndroidManifest.xml" || { echo "ERROR: $APK_PATH no contiene AndroidManifest.xml — APK corrupto"; exit 1; }
          APK_NAME="ivanna-omega-supreme-${GITHUB_SHA}.apk"
          cp "$APK_PATH" "./$APK_NAME"
          sha256sum "./$APK_NAME" | tee apk_sha256.txt
          ls -lh "./$APK_NAME"
          echo "APK_ARTIFACT_NAME=$APK_NAME" >> "$GITHUB_ENV"

      # ── STAGING OBLIGATORIO: prohibido copiar "si existe", siempre ────
      # ── se copia el binario recién validado o el job muere. ────────────
      - name: Stage daemon + effect lib into Magisk module (no legacy copy)
        run: |
          set -euo pipefail
          # REGLA: nunca "if [ -f ] cp" — el binario validado DEBE existir.
          test -f ivanna_daemon || { echo "ERROR: ivanna_daemon no compilado"; exit 1; }
          rm -f magisk_module/system/bin/ivanna_daemon
          mkdir -p magisk_module/system/bin
          cp ivanna_daemon magisk_module/system/bin/ivanna_daemon
          chmod 755 magisk_module/system/bin/ivanna_daemon
          # libomega_effect.so desde la salida de Gradle — obligatoria también
          EFFECT_SO=$(find app/build -path "*arm64-v8a*" -name "libomega_effect.so" | head -1)
          test -n "$EFFECT_SO" || { echo "ERROR: libomega_effect.so no encontrada en app/build"; exit 1; }
          mkdir -p magisk_module/system/vendor/lib64/soundfx
          rm -f magisk_module/system/vendor/lib64/soundfx/libomega_effect.so
          cp "$EFFECT_SO" magisk_module/system/vendor/lib64/soundfx/libomega_effect.so
          cp "$EFFECT_SO" ./libomega_effect_arm64.so
          file libomega_effect_arm64.so
          READELF=readelf
          command -v "$READELF" >/dev/null 2>&1 || READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          EFFECT_NEEDED="$("$READELF" -d -W ./libomega_effect_arm64.so 2>/dev/null || "$READELF" -dW ./libomega_effect_arm64.so 2>/dev/null || "$READELF" --dynamic-table ./libomega_effect_arm64.so 2>/dev/null || true)"
          echo "$EFFECT_NEEDED"
          echo "$EFFECT_NEEDED" | grep -qi "libc++_shared" && { echo "ERROR: libomega_effect.so depende de libc++_shared.so — audioserver no la puede resolver en /system/vendor/lib64/soundfx"; exit 1; }
          echo "OK: libomega_effect.so no depende de libc++_shared.so"

      # ── MANIFIESTO DE ARTEFACTOS ───────────────────────────────────────
      - name: Generate BUILD_INFO manifest
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version=' magisk_module/module.prop | cut -d= -f2)
          {
            echo "commit=$GITHUB_SHA"
            echo "version=$VERSION"
            echo "run=$GITHUB_RUN_NUMBER"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "daemon_sha256=$(sha256sum ivanna_daemon | awk '{print $1}')"
            echo "daemon_file=$(file ivanna_daemon)"
            echo "effect_sha256=$(sha256sum libomega_effect_arm64.so | awk '{print $1}')"
            echo "ndk=${ANDROID_NDK_VERSION}"
          } > magisk_module/BUILD_INFO
          cp magisk_module/BUILD_INFO ./BUILD_INFO
          cat magisk_module/BUILD_INFO

      # ── VALIDACIONES DE CALIDAD DEL MÓDULO MAGISK (FLANCO 1) ───────────
      - name: Validate Magisk module sources (ash -n, no CRLF, valid XML, HRTF hashes)
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y busybox

          echo "=== 1. Check busybox ash -n en todos los scripts shell ==="
          # while-read con -print0: tolera espacios en rutas y, a diferencia de
          # `for x in $(find ...)`, un fallo de find aborta el paso (set -e + pipefail).
          n_sh=0
          while IFS= read -r -d '' sh_file; do
            echo "  ash -n: $sh_file"
            busybox ash -n "$sh_file"
            n_sh=$((n_sh+1))
          done < <(find magisk_module -type f \( -name "*.sh" -o -name "update-binary" \) -print0)
          [ "$n_sh" -gt 0 ] || { echo "ERROR: no se encontró ningún script shell que validar en magisk_module"; exit 1; }
          echo "OK: todos los scripts shell pasaron busybox ash -n"

          echo "=== 2. Check sin CRLF en archivos de texto del módulo ==="
          python3 -c '
          import os, sys
          text_exts = {".sh", ".prop", ".rule", ".xml", ".json", ".csv", ".txt", ".md"}
          text_names = {"update-binary", "BUILD_INFO", "sepolicy.rule", "module.prop"}
          crlf = []
          for root, _, files in os.walk("magisk_module"):
              for f in files:
                  ext = os.path.splitext(f)[1].lower()
                  if ext in text_exts or f in text_names:
                      p = os.path.join(root, f)
                      with open(p, "rb") as fp:
                          data = fp.read()
                          if data.startswith(b"\x7fELF"):
                              continue
                          if b"\r" in data:
                              crlf.append(p)
          if crlf:
              print("ERROR: Archivos con CRLF encontrados:", crlf)
              sys.exit(1)
          print("OK: sin CRLF en ningún archivo de texto del módulo")
          '

          echo "=== 3. Validar sintaxis XML en magisk_module ==="
          python3 -c '
          import xml.etree.ElementTree as ET, glob, sys
          for xml_file in glob.glob("magisk_module/**/*.xml", recursive=True):
              try:
                  ET.parse(xml_file)
                  print("  XML válido:", xml_file)
              except Exception as e:
                  print("ERROR XML inválido:", xml_file, e)
                  sys.exit(1)
          print("OK: todos los archivos XML son válidos")
          '

          echo "=== 4. Validar hrtf_index.json contra los archivos .ihr1 ==="
          python3 -c '
          import json, hashlib, os, sys
          idx_path = "magisk_module/system/etc/ivanna_omega/hrtf/hrtf_index.json"
          with open(idx_path) as f:
              data = json.load(f)
          for subj in data["subjects"]:
              sfile = subj["file"]
              fn = os.path.join("magisk_module/system/etc/ivanna_omega/hrtf", sfile)
              if not os.path.isfile(fn):
                  print("ERROR: falta .ihr1:", fn)
                  sys.exit(1)
              with open(fn, "rb") as bf:
                  h = hashlib.sha256(bf.read()).hexdigest()
              if h != subj["sha256"]:
                  print("ERROR: hash mismatch en " + sfile + ": " + h + " vs " + subj["sha256"])
                  sys.exit(1)
          print("OK: todos los .ihr1 coinciden con hrtf_index.json")
          '

      # ── EMPAQUETADO + VALIDACIÓN DEL ZIP FINAL ─────────────────────────
      - name: Package Magisk module + verify zip integrity
        run: |
          set -euo pipefail
          sh -n magisk_module/customize.sh || { echo "ERROR: customize.sh syntax invalid"; exit 1; }
          test -f magisk_module/sepolicy.rule || { echo "ERROR: falta sepolicy.rule"; exit 1; }
          if grep -vE '^[[:space:]]*#|^[[:space:]]*$' magisk_module/sepolicy.rule | grep -qE '^[[:space:]]*(type|attribute|typeattribute|allowxperm|neverallow|require)[[:space:]]'; then
            echo "ERROR: sepolicy.rule usa sintaxis .te (: o ;)"; exit 1
          fi
          ZIPNAME="ivanna-magisk-module-arm64-${GITHUB_SHA}.zip"
          # v2.5.31: ANTES se excluían system/etc/ivanna_omega/sofa/* y *.sofa del zip, así que customize.sh
          # nunca encontraba los SOFA (HpIR ARI + HRTF AES69) y el módulo los daba por "no encontrado".
          # Los datasets SOFA/RIR/HRTF/SAF SIEMPRE viajan en el zip; la validación de abajo lo exige.
          ( cd magisk_module && zip -r "$GITHUB_WORKSPACE/$ZIPNAME" . -x "*.git*" )
          # El zip DEBE contener META-INF, module.prop, daemon, effect, sepolicy.rule y BUILD_INFO
          unzip -l "$ZIPNAME" | grep -q "META-INF/com/google/android/update-binary" || { echo "ERROR: zip sin META-INF"; exit 1; }
          unzip -l "$ZIPNAME" | grep -q "module.prop"                               || { echo "ERROR: zip sin module.prop"; exit 1; }
          unzip -l "$ZIPNAME" | grep -q "system/bin/ivanna_daemon"                  || { echo "ERROR: zip sin daemon"; exit 1; }
          unzip -l "$ZIPNAME" | grep -q "system/vendor/lib64/soundfx/libomega_effect.so" || { echo "ERROR: zip sin effect lib"; exit 1; }
          unzip -l "$ZIPNAME" | grep -q "sepolicy.rule"                             || { echo "ERROR: zip sin sepolicy.rule"; exit 1; }
          unzip -l "$ZIPNAME" | grep -q "BUILD_INFO"                                || { echo "ERROR: zip sin BUILD_INFO"; exit 1; }
          # Datasets (v2.5.31): el zip debe contener EXACTAMENTE lo que hay en el árbol del módulo.
          # Antes los .sofa se excluían en silencio y el despliegue SOFA fallaba sin que ningún chequeo lo viera.
          DS="magisk_module/system/etc/ivanna_omega"
          for pair in "sofa:*.sofa" "rir:*.wav" "hrtf:*.ihr1"; do
            d="${pair%%:*}"; pat="${pair#*:}"
            EXP=$(find "$DS/$d" -type f -name "$pat" | wc -l)
            GOT=$(unzip -Z1 "$ZIPNAME" | grep -c "^system/etc/ivanna_omega/$d/.*\.${pat#*.}$" || true)
            [ "$EXP" -gt 0 ] || { echo "ERROR: el árbol del módulo no tiene datasets $d"; exit 1; }
            [ "$EXP" = "$GOT" ] || { echo "ERROR: zip con $GOT/$EXP archivos de $d (dataset incompleto)"; exit 1; }
            echo "dataset $d: $GOT/$EXP en el zip"
          done
          # Enforce shipped dataset contract, not just source/ZIP parity.
          SOFA_COUNT=$(find "$DS/sofa" -type f -name '*.sofa' | wc -l | tr -d '[:space:]')
          ARI_COUNT=$(find "$DS/sofa/ari" -type f -name '*.sofa' | wc -l | tr -d '[:space:]')
          RIR_COUNT=$(find "$DS/rir" -maxdepth 1 -type f -name 'rir_*.wav' | wc -l | tr -d '[:space:]')
          HRTF_COUNT=$(find "$DS/hrtf" -maxdepth 1 -type f -name '*.ihr1' | wc -l | tr -d '[:space:]')
          [ "$SOFA_COUNT" -eq 239 ] || { echo "ERROR: SOFA package must contain 239 files; found $SOFA_COUNT"; exit 1; }
          [ "$ARI_COUNT" -eq 200 ] || { echo "ERROR: HpIR ARI package must contain 200 files; found $ARI_COUNT"; exit 1; }
          [ "$RIR_COUNT" -eq 200 ] || { echo "ERROR: RIR package must contain 200 WAV files; found $RIR_COUNT"; exit 1; }
          [ "$HRTF_COUNT" -eq 12 ] || { echo "ERROR: HRTF package must contain 12 IHR1 files; found $HRTF_COUNT"; exit 1; }
          unzip -Z1 "$ZIPNAME" | grep -q "^system/etc/ivanna_omega/rir/metadata.csv$" || { echo "ERROR: zip sin rir/metadata.csv"; exit 1; }
          unzip -Z1 "$ZIPNAME" | grep -q "^system/etc/ivanna_omega/hrtf/hrtf_index.json$" || { echo "ERROR: zip sin hrtf_index.json"; exit 1; }
          unzip -Z1 "$ZIPNAME" | grep -q "^saf/SAF_model.json$" || { echo "ERROR: zip sin saf/SAF_model.json"; exit 1; }
          unzip -t "$ZIPNAME" || { echo "ERROR: zip corrupto o con fallo CRC"; exit 1; }
          # Extracción + validación del daemon DENTRO del zip
          rm -f extracted_daemon
          unzip -p "$ZIPNAME" system/bin/ivanna_daemon > extracted_daemon
          FOUT="$(file extracted_daemon)"
          echo "$FOUT"
          echo "$FOUT" | grep -q "64-bit" || { echo "ERROR: daemon del zip no es 64-bit"; exit 1; }
          echo "$FOUT" | grep -qiE "aarch64|arm64" || { echo "ERROR: daemon del zip no es ARM64"; exit 1; }
          H_ZIP=$(sha256sum extracted_daemon | awk '{print $1}')
          H_SRC=$(sha256sum ivanna_daemon    | awk '{print $1}')
          echo "zip_daemon_sha256=$H_ZIP"
          echo "src_daemon_sha256=$H_SRC"
          [ "$H_ZIP" = "$H_SRC" ] || { echo "ERROR FATAL: hash daemon zip != hash daemon compilado"; exit 1; }
          echo "INTEGRITY OK — compilación → zip: hash idéntico"
          ls -lh "$ZIPNAME"

      # ── VERIFICACIÓN + EMPAQUETADO DEL APK ─────────────────────────────
      # FIX: los pasos "Verify APK integrity before upload" y
      # "Package APK deterministically" aparecían DOS veces. El segundo
      # intento de `zip -T ivanna-apk-package.zip *` incluía el propio
      # .zip en sí mismo → APK bundle corrupto, no descomprimible.
      # También: `sha256sum -c apk_sha256.txt` fallaba porque en ese
      # punto apk_sha256.txt tenía la ruta de Gradle (app/build/…), no
      # el nombre canónico ivanna-omega-supreme-SHA.apk.
      # Solución: un único bloque ordenado con hash canónico desde el inicio.

      - name: Verify and package APK
        shell: bash
        run: |
          set -euo pipefail

          # Localizar el APK producido por Gradle — debe existir, tamaño >0
          APK=$(find app/build/outputs/apk -name "*.apk" -type f | head -n 1)
          [ -n "$APK" ] || { echo "ERROR: Gradle no produjo ningún APK"; exit 1; }
          [ -s "$APK" ] || { echo "ERROR: APK existe pero está vacío"; exit 1; }

          echo "APK origen: $APK  ($(du -h "$APK" | cut -f1))"
          file "$APK"

          # Validación ZIP — todo APK es un ZIP; debe contener AndroidManifest.xml
          unzip -t "$APK"
          unzip -l "$APK" | grep -q "AndroidManifest.xml" \
            || { echo "ERROR: APK sin AndroidManifest.xml — corrupto"; exit 1; }

          # Renombrar al nombre canónico versionado por SHA
          APK_FINAL="ivanna-omega-supreme-${GITHUB_SHA}.apk"
          cp "$APK" "./$APK_FINAL"

          # Hash del archivo canónico (este es el que viaja como artefacto)
          sha256sum "./$APK_FINAL" | tee apk_sha256.txt
          echo "APK_ARTIFACT_NAME=$APK_FINAL" >> "$GITHUB_ENV"

          # Verificación cruzada inmediata — sha256sum -c lee el nombre del propio txt
          sha256sum -c apk_sha256.txt

          echo "✓ APK verificado: $APK_FINAL"

      - name: Prune old workflow artifacts to free storage quota
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | .id' 2>/dev/null | head -n 60 | while read -r aid; do
              [ -n "$aid" ] && gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${aid}" 2>/dev/null || true
            done

      - name: Stage build bundle to draft GitHub Release (quota-independent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STAGE_TAG="staging-${GITHUB_SHA}-${GITHUB_RUN_ID}"
          NOTES="Transient build staging for commit ${GITHUB_SHA} (run #${GITHUB_RUN_NUMBER})."
          if ! gh release view "$STAGE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$STAGE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "[staging] ${GITHUB_SHA}" \
              --draft \
              --notes "$NOTES"
          fi
          gh release upload "$STAGE_TAG" \
            "ivanna-magisk-module-arm64-${GITHUB_SHA}.zip" \
            "ivanna-omega-supreme-${GITHUB_SHA}.apk" \
            ivanna_daemon \
            libomega_effect_arm64.so \
            daemon_sha256.txt \
            apk_sha256.txt \
            --repo "$GITHUB_REPOSITORY" --clobber
          echo "✓ Bundle staged en draft release $STAGE_TAG"

  # ── DETECCIÓN ROBUSTA DE RELEASE: basada en el diff real, no en el texto del mensaje ──
  # publish-release dependía de que el mensaje del commit contuviera literalmente "release:" o
  # "— v". Eso fallaba en silencio para mensajes legítimos de bump como
  # "chore(release): v2.5.130 (421) — productor del reloj de hardware..." (el paréntesis rompe
  # el match de "release:") o "feat(...): ...; chore(release): v2.5.129 (420)" (sin em-dash antes
  # de la v). Resultado real verificado: v2.5.129, v2.5.130 y v2.5.131 llegaron a main con el
  # version.properties/module.prop bumpeado pero el job de publicación se saltó siempre — cero
  # release real (no-draft) existe para esas versiones; update.json de Magisk apuntaba a un
  # asset que nunca se publicó. Ahora se detecta el bump comparando version.properties contra el
  # commit padre: no depende de cómo se redacte el mensaje.
  detect-release:
    name: Detect version bump (triggers publish-release)
    runs-on: ubuntu-22.04
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: ¿Cambió version.properties respecto al commit anterior?
        id: check
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "workflow_dispatch manual en main: se fuerza la publicación."
            exit 0
          fi
          if [ "${{ github.event_name }}" != "push" ] || [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git rev-parse HEAD~1 >/dev/null 2>&1 && git diff --quiet HEAD~1 HEAD -- version.properties; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "version.properties sin cambios respecto al commit anterior: no es un bump de release."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "version.properties cambió (o es el primer commit visible): se publica release."
          fi

  # ── JOB DE VERIFICACIÓN: descarga y valida artefactos publicados ──────
  verify-release:
    name: Verify published artifact (download → extract → validate)
    runs-on: ubuntu-22.04
    needs: [build-apk]
    steps:
      - uses: actions/checkout@v5

      - name: Download staged bundle from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STAGE_TAG="staging-${GITHUB_SHA}-${GITHUB_RUN_ID}"
          gh release download "$STAGE_TAG" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Validate downloaded zip end-to-end
        run: |
          set -euo pipefail
          ZIPNAME="ivanna-magisk-module-arm64-${GITHUB_SHA}.zip"
          test -f "$ZIPNAME"        || { echo "ERROR: zip no publicado"; exit 1; }
          test -f ivanna_daemon     || { echo "ERROR: daemon suelto no publicado"; exit 1; }
          test -f daemon_sha256.txt || { echo "ERROR: manifiesto de hash ausente"; exit 1; }

          APK_NAME="ivanna-omega-supreme-${GITHUB_SHA}.apk"
          test -f "$APK_NAME"      || { echo "ERROR: APK no publicado en el artefacto"; exit 1; }
          test -s "$APK_NAME"      || { echo "ERROR: APK publicado pero vacío (0 bytes)"; exit 1; }
          unzip -t "$APK_NAME"     || { echo "ERROR: APK publicado no pasa unzip -t"; exit 1; }
          unzip -l "$APK_NAME" | grep -q "AndroidManifest.xml" || { echo "ERROR: APK publicado sin AndroidManifest.xml"; exit 1; }
          test -f apk_sha256.txt   || { echo "ERROR: manifiesto de hash del APK ausente"; exit 1; }
          H_APK_PUBLISHED=$(sha256sum "$APK_NAME" | awk '{print $1}')
          H_APK_MANIFEST=$(awk '{print $1}' apk_sha256.txt)
          [ "$H_APK_PUBLISHED" = "$H_APK_MANIFEST" ] || { echo "ERROR FATAL: hash APK publicado != manifiesto apk_sha256.txt"; exit 1; }
          echo "APK OK: $APK_NAME ($(du -h "$APK_NAME" | cut -f1))"

          rm -f extracted_daemon
          unzip -p "$ZIPNAME" system/bin/ivanna_daemon > extracted_daemon
          test -s extracted_daemon || { echo "ERROR: daemon vacío dentro del zip"; exit 1; }

          FOUT="$(file extracted_daemon)"
          echo "$FOUT"
          echo "$FOUT" | grep -q "ELF"               || { echo "ERROR: no es ELF"; exit 1; }
          echo "$FOUT" | grep -q "64-bit"            || { echo "ERROR: ARM32 o no-64 detectado"; exit 1; }
          echo "$FOUT" | grep -qiE "aarch64|arm64"   || { echo "ERROR: no es AArch64"; exit 1; }

          readelf -h extracted_daemon | grep -q "AArch64" || { echo "ERROR: readelf no confirma AArch64"; exit 1; }
          readelf -h extracted_daemon | grep -qE "Type:.*DYN" || { echo "ERROR: no es PIE"; exit 1; }

          H_EXTRACT=$(sha256sum extracted_daemon | awk '{print $1}')
          H_PUBLISHED=$(sha256sum ivanna_daemon   | awk '{print $1}')
          H_RECORDED=$(awk '{print $1}' daemon_sha256.txt)

          echo "extracted=$H_EXTRACT"
          echo "published=$H_PUBLISHED"
          echo "recorded =$H_RECORDED"

          [ "$H_EXTRACT" = "$H_PUBLISHED" ] || { echo "ERROR: daemon del zip != daemon publicado"; exit 1; }
          [ "$H_EXTRACT" = "$H_RECORDED"  ] || { echo "ERROR: daemon del zip != hash registrado en BUILD"; exit 1; }

          N_IHR1=$(unzip -l "$ZIPNAME" | grep -c "hrtf/.*\.ihr1" || true)
          echo "ihr1_en_zip=$N_IHR1"
          [ "$N_IHR1" -ge 12 ] || { echo "ERROR: zip con $N_IHR1 IHR1 (mínimo 12)"; exit 1; }
          unzip -l "$ZIPNAME" | grep -q "hrtf/hrtf_index.json" || { echo "ERROR: zip sin hrtf_index.json"; exit 1; }
          unzip -p "$ZIPNAME" system/etc/ivanna_omega/hrtf/kemar.ihr1 > /tmp/kemar_check.ihr1
          MAGIC=$(head -c4 /tmp/kemar_check.ihr1)
          [ "$MAGIC" = "IHR1" ] || { echo "ERROR: kemar.ihr1 corrupto en zip (magic=$MAGIC)"; exit 1; }

          unzip -p "$ZIPNAME" BUILD_INFO | tee build_info_check.txt
          grep -q "commit=$GITHUB_SHA" build_info_check.txt || { echo "ERROR: BUILD_INFO commit mismatch"; exit 1; }
          grep -q "$H_EXTRACT" build_info_check.txt         || { echo "ERROR: BUILD_INFO hash mismatch"; exit 1; }

          echo "════════════════════════════════════════════════════════"
          echo " VERIFY-RELEASE OK"
          echo " Único daemon válido: ELF 64-bit LSB AArch64 PIE"
          echo " hash idéntico: compilación → zip → artefacto → módulo"
          echo "════════════════════════════════════════════════════════"

      - name: Generate OEM stability report
        if: always()
        run: |
          chmod +x .github/scripts/generate_oem_report.sh
          .github/scripts/generate_oem_report.sh

      - name: Run OEM certification gate
        if: always()
        run: |
          chmod +x .github/scripts/oem_certification_gate.sh
          .github/scripts/oem_certification_gate.sh

      - name: Collect OEM performance telemetry
        if: always()
        run: |
          chmod +x tools/telemetry/collect_oem_metrics.sh
          tools/telemetry/collect_oem_metrics.sh

      - name: Store OEM metrics history
        if: always()
        run: |
          chmod +x .github/scripts/store_metrics_history.sh
          .github/scripts/store_metrics_history.sh

      - name: Generate OEM dashboard
        if: always()
        run: |
          python3 tools/dashboard/generate_dashboard.py

      - name: Compare OEM performance regression
        if: always()
        run: |
          python3 tools/dashboard/compare_history.py

      - name: Run OEM performance quality gate
        if: always()
        run: |
          python3 tools/dashboard/oem_quality_gate.py

      - name: Run IVANNA IAEL Audio Certification
        if: always()
        run: |
          python3 tools/iael/iael_audio_certification.py

  # ── PUBLICAR RELEASE ────────────────────────────────────────────────────
  publish-release:
    name: Publish GitHub Release (asset que Magisk update.json espera)
    runs-on: ubuntu-22.04
    needs: [verify-release, detect-release]
    if: needs.detect-release.outputs.should_release == 'true'
    concurrency:
      group: omega-release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download verified bundle from draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STAGE_TAG="staging-${GITHUB_SHA}-${GITHUB_RUN_ID}"
          gh release download "$STAGE_TAG" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Derivar versión desde module.prop (fuente única de verdad)
        id: ver
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version=' magisk_module/module.prop | cut -d= -f2)
          [ -n "$VERSION" ] || { echo "ERROR: module.prop sin campo version="; exit 1; }
          UPDATE_JSON_VERSION=$(python3 -c "import json;print(json.load(open('magisk_module/update.json'))['version'])")
          MODULE_CODE=$(grep -m1 '^versionCode=' magisk_module/module.prop | cut -d= -f2)
          UPDATE_JSON_CODE=$(python3 -c "import json;print(json.load(open('magisk_module/update.json'))['versionCode'])")
          PROPERTIES_VERSION=$(grep -m1 '^versionName=' version.properties | cut -d= -f2)
          PROPERTIES_CODE=$(grep -m1 '^versionCode=' version.properties | cut -d= -f2)
          if [ "$VERSION" != "$UPDATE_JSON_VERSION" ] ||
             [ "$VERSION" != "v$PROPERTIES_VERSION" ] ||
             [ "$MODULE_CODE" != "$UPDATE_JSON_CODE" ] ||
             [ "$MODULE_CODE" != "$PROPERTIES_CODE" ]; then
            echo "::error::Version metadata mismatch: module.prop=$VERSION/$MODULE_CODE update.json=$UPDATE_JSON_VERSION/$UPDATE_JSON_CODE version.properties=$PROPERTIES_VERSION/$PROPERTIES_CODE"
            exit 1
          fi
          EXPECTED_ZIP="https://github.com/$GITHUB_REPOSITORY/releases/download/$VERSION/ivanna_omega_supreme_$VERSION.zip"
          ACTUAL_ZIP=$(python3 -c "import json;print(json.load(open('magisk_module/update.json'))['zipUrl'])")
          if [ "$EXPECTED_ZIP" != "$ACTUAL_ZIP" ]; then
            echo "::error::update.json zipUrl does not match the canonical release asset: $ACTUAL_ZIP"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Versión y metadatos detectados coherentes: $VERSION ($MODULE_CODE)"

      - name: Rename module zip al nombre canónico que espera update.json
        run: |
          set -euo pipefail
          SRC="ivanna-magisk-module-arm64-${GITHUB_SHA}.zip"
          test -f "$SRC" || { echo "ERROR: module zip no encontrado en el artifact"; exit 1; }
          cp "$SRC" "ivanna_omega_supreme_${{ steps.ver.outputs.version }}.zip"
          ls -lh "ivanna_omega_supreme_${{ steps.ver.outputs.version }}.zip"

      - name: Generar flyer promocional dinámico de la versión
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          pip install Pillow matplotlib
          python3 tools/promo/generate_release_flyer.py "${{ steps.ver.outputs.version }}"

      - name: Crear o actualizar el Release (sin enmascarar fallos)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          trap 'echo "::error title=publish-release::línea $LINENO falló: ${BASH_COMMAND:0:300}"' ERR
          TAG="${{ steps.ver.outputs.version }}"
          ZIP_NAME="ivanna_omega_supreme_${TAG}.zip"
          APK_NAME="ivanna-omega-supreme-${GITHUB_SHA}.apk"
          FLYER_TAG="docs/release_media/ivanna_promo_flyer_${TAG}.png"
          FLYER_CANONICAL="docs/release_media/ivanna_promo_flyer.png"
          NOTES="Build automatico desde commit ${GITHUB_SHA} (run #${GITHUB_RUN_NUMBER})."
          STAGE_TAG="staging-${GITHUB_SHA}-${GITHUB_RUN_ID}"

          EXTRA_ASSETS=()
          [ -f "$FLYER_TAG" ] && EXTRA_ASSETS+=("$FLYER_TAG")
          [ -f "$FLYER_CANONICAL" ] && EXTRA_ASSETS+=("$FLYER_CANONICAL")

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" "$ZIP_NAME" "$APK_NAME" "${EXTRA_ASSETS[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "IVANNA OMEGA SUPREME $TAG" \
              --notes "$NOTES"
          else
            # Los releases publicados son INMUTABLES (GitHub): no admiten subir/borrar assets.
            # Re-publicar la misma versión nunca puede funcionar; hay que subir la versión
            # (module.prop + update.json + version.properties). No es un fallo del build:
            # se avisa y se conserva el draft staging-* con el bundle verificado.
            IMMUTABLE=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.immutable // false')
            if [ "$IMMUTABLE" = "true" ]; then
              if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qxF "$APK_NAME"; then
                echo "Release $TAG (inmutable) ya contiene este build ${GITHUB_SHA}."
                exit 0
              else
                echo "::error title=publish-release::El release $TAG es inmutable y no contiene el build ${GITHUB_SHA}. Incrementa module.prop, update.json y version.properties; bundle verificado conservado en el draft ${STAGE_TAG}."
                exit 1
              fi
            fi
            # Quitar APKs de commits anteriores: el release solo debe exponer el build actual.
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
              | grep -E '^ivanna-omega-supreme-[0-9a-f]{40}\.apk$' | grep -v -F "$APK_NAME" \
              | while read -r old; do gh release delete-asset "$TAG" "$old" --repo "$GITHUB_REPOSITORY" --yes; done || true
            # Sin '|| true': si la subida falla, el job DEBE fallar (antes quedaban assets viejos con notas nuevas).
            gh release upload "$TAG" "$ZIP_NAME" "$APK_NAME" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes "$NOTES"
          fi

          # Verificación posterior: lo publicado debe tener el mismo tamaño que lo local.
          for f in "$ZIP_NAME" "$APK_NAME"; do
            REMOTE=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq ".assets[] | select(.name==\"$f\") | .size")
            LOCAL=$(stat -c%s "$f")
            [ "$REMOTE" = "$LOCAL" ] || { echo "::error title=publish-release::$f en release=$REMOTE bytes, local=$LOCAL — artefacto desactualizado"; exit 1; }
          done
          echo "✓ Assets del release $TAG verificados contra el build ${GITHUB_SHA}"

          # Limpiar draft temporal de staging
          gh release delete "$STAGE_TAG" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          # Barrer drafts staging-* huérfanos de >6 h (no toca builds de otras ramas en curso; cada uno retiene ~110 MB).
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft,createdAt \
            --jq '.[] | select(.isDraft and (.tagName|startswith("staging-")) and ((.createdAt|fromdateiso8601) < (now-21600))) | .tagName' \
            | while read -r t; do gh release delete "$t" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true; done
          echo "Release $TAG publicado con el asset que magisk_module/update.json espera."

      - name: Difundir lanzamiento en redes sociales y webhooks
        if: github.event_name == 'workflow_dispatch' && inputs.broadcast_release == true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SOCIAL_BROADCAST_WEBHOOK_URL: ${{ secrets.SOCIAL_BROADCAST_WEBHOOK_URL }}
        run: |
          python3 tools/promo/broadcast_release.py

