name: Tests host (CTest)

# Flanco: Tests nativos host (CTest) — ver CLAIMS/tests-host-ctest.md.
# Workflow dedicado y aislado: NO reemplaza ni toca build.yml (daemon/Magisk)
# ni supply-chain.yml. Su única razón de existir: la puerta de regresión de
# todo el DSP en host, que antes no existía en ninguna parte.
#
# Historial: scripts/run_ctest.sh invocaba `cmake --preset host-release` con
# CMakePresets.json inexistente → fallaba garantizado. Hoy esa puerta corre
# en cada push/PR sobre las rutas que puede romper.

on:
  push:
    paths:
      - 'app/src/main/cpp/**'
      - 'tests/**'
      - 'scripts/run_ctest.sh'
      - '.github/workflows/tests-host.yml'
  pull_request:
    paths:
      - 'app/src/main/cpp/**'
      - 'tests/**'
      - 'scripts/run_ctest.sh'
      - '.github/workflows/tests-host.yml'
  # TSan no cabe en la puerta por-push: 2 cancelaciones medidas (corridas
  # 34166260673 y 34167465625 — jobs cancelados exactamente a los 20m15s y
  # 45m15s, ambos en pleno CTest) demuestran que en los runners de 2 núcleos
  # TSan necesita más de 45 min. Sale semanal y a demanda; el resto del
  # tiempo la regresión de concurrencia queda vigilada por los tests de
  # stress ya incluidos en la pata normal (test_control_frame_bus_stress,
  # test_audio_bus, DaemonThreadStress).
  schedule:
    - cron: '23 4 * * 1'   # lunes 04:23 UTC — evita la hora pico de GitHub
  workflow_dispatch:

permissions:
  contents: read

# Un push nuevo cancela la corrida del push anterior que aún esté corriendo:
# la única corrida que importa es la del HEAD de main. Ahorra minutos de
# runner y evita colas cuando se encadenan pushes (patrón de este repo:
# commit breve + push por ciclo).
concurrency:
  group: tests-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── PUERTA por push/PR: normal + ASan+UBSan (verificadas ~1 min cada una) ──
  ctest:
    name: ${{ matrix.san == 'asan' && 'CTest (ASan+UBSan)' || 'CTest' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        san: ['', 'asan']
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
      IVANNA_SAN: ${{ matrix.san }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar cmake (verificación explícita de versión)
        run: |
          cmake --version || { sudo apt-get update -qq && sudo apt-get install -y -qq cmake; }
          cmake --version | head -1

      # Verificación de no-regresión de la causa raíz corregida hoy:
      # CMakePresets.json NO debe reaparecer apuntando a nada muerto.
      - name: Pre-flight — sin presets fantasma
        run: |
          if [ -f CMakePresets.json ]; then
            echo "CMakePresets.json reapareció — run_ctest.sh ya no depende de él, pero revisa que no vuelva a romper la puerta de tests."; exit 1
          fi
          bash -n scripts/run_ctest.sh

      - name: Configurar, compilar y correr CTest (33→60 targets, GTest vendoreado, offline)
        run: bash scripts/run_ctest.sh

      - name: Resumen
        if: always()
        run: echo "Puerta de tests host ejecutada (san=${IVANNA_SAN:-none}). Cualquier fallo aquí es una regresión DSP real o un test roto — no se ignora."

  # ── CARRIL TSan: semanal + manual — NO bloquea pushes ──────────────────────
  # Evidencia de por qué NO va en la matriz de la puerta: corridas
  # 34166260673 y 34167465625 — cancelado a los 20m15s (timeout 20) y luego a
  # los 45m15s (timeout 45), en pleno CTest. 90 min = 2x el peor caso medido.
  ctest-tsan:
    name: CTest (TSan, carril semanal)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
      IVANNA_SAN: 'tsan'
    steps:
      - uses: actions/checkout@v4

      - name: Instalar cmake
        run: |
          cmake --version || { sudo apt-get update -qq && sudo apt-get install -y -qq cmake; }
          cmake --version | head -1

      - name: Pre-flight — sin presets fantasma
        run: bash -n scripts/run_ctest.sh

      - name: CTest completo con ThreadSanitizer
        run: bash scripts/run_ctest.sh

      - name: Resumen
        if: always()
        run: echo "Carril TSan ejecutado. Un fallo aquí = data race real en el DSP — prioridad máxima de investigación."

  # ── Validación de datasets HRTF distribuidos (pipeline HRTF-tools + Tests host) ──
  # Pendiente heredado del relevo HRTF-tools: verify_dataset.py existía pero
  # nadie lo corría en CI — un dataset mutilado (como hrtf_database.bin, que
  # estuvo roto por codec UTF-8) podía volver a colarse en un release sin que
  # nadie se enterara. Layout derivado línea a línea de HRTFBinLoader.cpp.
  hrtf-datasets:
    name: Datasets HRTF (13 distribuidos)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # FIX (corrida 34543348492): la versión vigente de verify_dataset.py
      # (del relevo HRTF-tools) usa numpy a nivel de módulo y el runner
      # ubuntu-latest no lo trae — ModuleNotFoundError. numpy es dependencia
      # oficial del propio script (pip install sofar numpy, como sofa_to_ihr1).
      - name: Instalar numpy (dependencia del validador)
        run: pip install --quiet numpy

      - name: Validar los 13 datasets IHR1 contra el layout del lector C++
        run: |
          set -o pipefail
          python3 tools/hrtf/verify_dataset.py \
            app/src/main/assets/ivanna_omega/hrtf/*.ihr1 \
            magisk_module/system/etc/ivanna_omega/hrtf/*.ihr1 \
            --engine-sr 48000 | tee /tmp/hrtf-validation.log
          COUNT=$(grep -c "^PASS" /tmp/hrtf-validation.log || true)
          [ "$COUNT" = "13" ] || {
            echo "::error::Se esperaban exactamente 13 datasets PASS, hay $COUNT — dataset faltante o ilegible: no se publica"; exit 1
          }

      - name: Resumen
        if: always()
        run: echo "Puerta de datasets HRTF — cualquier FAIL impide que un binario ilegible por HRTFBinLoader llegue al APK (no se ignora)."
