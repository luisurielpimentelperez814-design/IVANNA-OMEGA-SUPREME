# v2.5.380: Ruta B — sin fallback global (quita el mute de YTM) + passthrough garantizado en omega_process + diagnostico visible del fallo de acople (logs en los 3 retornos silenciosos + exchange(), throttle 1/30 s); T0 confirmo que el descriptor NO necesita bajarse (APM 128 KB, max 129 KB). ORBE optimizado: invariantes por banda fuera del bucle por bin + 2 pow en vez de 4 + anillo en dos tramos + 2 FFT reales en una compleja (throughput 3.9x -> 6.3x RT, THD+N/IMD iguales o mejores). CTest host 885/885.
# v2.5.379: Ruta B — descubrimiento del sessionId REAL por el daemon root (dumpsys media.audio_flinger, cada 3 s), publicado en el snapshot (ABI v11: discovered_session_id + discovered_session_gen, offsets viejos intactos) + GET_STATUS; la app acopla omega a la sesión real en vez de la sesión 0 (que en este G85 falla en silencio: el efecto se crea pero nunca recibe frames) y libera el global ANTES de acoplar, en el mismo ciclo del watchdog (la carrera que mató los hot fixes por broadcast). Sesión 0 y sondeo por reflexión quedan como fallback. Tests: 13/13 nuevos (test_session_discovery) + 5 JVM (shouldAttachDiscoveredSession) + 5 Robolectric (RouteBDiscoveredSessionTest).
# v2.5.401: FUSIÓN MAGISTRAL — el sistema omnipotente computacional auditivo, completo, sin deuda. (1) ASRC v6 MÚSCULO: sin servo propio (el ratio lo calcula el cerebro y lo lee del estado de fusión); mide el reloj (mmap + write-timing) y PUBLICA las mediciones; FIR 287 taps con interpolación CÚBICA Catmull-Rom; aplica el campo Ψ como FIR de 64 taps por oído; mide la coherencia 1–8 Hz (alimenta η); sin cerebro vivo o ratio viejo (>500 ms) → passthrough. (2) DAEMON v2 CEREBRO (492 líneas, reemplaza el v1 de 793): servo Kalman 3 estados, certificación del reloj en vivo, sesión REAL cada 3 s, veredicto + control de efectos (todo apagado por defecto), snapshot neutro + heartbeat + socket de vida @omega_daemon_socket. (3) NÚCLEO Ψ VIVO (psi_core.h): el campo Ψ(r,θ,φ,t; η,a) — Ec. 4 dη/dt (η se adapta a tu cerebro), Γ(η), Ec. 2 ILD con TU radio de cabeza (Ec. 3); el cerebro convierte las 32 ganancias ERB en un FIR de 64 taps que el músculo convoluciona. (4) ESTADO DE FUSIÓN (seqlock, __atomic_*, C y C++): un solo estado, un solo bucle. El módulo principal ahora ES la fusión. Fase 1: ASRC + campo Ψ; el resto por fases, medido. Verificación en vivo pendiente. **NO reiniciar audioserver a mano.**
