# v2.5.374: Ruta B — AudioSessionReceiver roto (causa raíz: el receiver dinámico se registraba con RECEIVER_NOT_EXPORTED, que en API 33+ solo recibe broadcasts de la propia app; el OPEN_AUDIO_EFFECT_CONTROL_SESSION lo emite system_server, así que el receiver NUNCA disparaba) + sondeo de sesiones activas (AudioManager.getActivePlaybackConfigurations, best-effort: AOSP anonimiza las sesiones de terceros, sin sessionId) + manejo del -38 (INVALID_OPERATION/ENOSYS de EffectChain::addEffect_ll cuando getInsertIndex devuelve -1, p. ej. por conflicto con un efecto INSERT_EXCLUSIVE) con clasificación, hint y backoff sin crash + extirpación de Dolby (dlb_*) y music_helper de los applies de postprocess en el repo (merge_omega_xml + sku_blair) + volumen de Ruta A: ya no se pide audio-focus MAY_DUCK en el modelo delta (el duck bajaba la fuente ~-14 dB y el delta no podía restaurar el nivel) + captura: anillo de AudioRecord 4→8 bloques, NPE analyze decimado bajo carga, aviso de sobrecarga del bucle y rastro del AudioRecord -22 + audio_effect_compat.h a valores modernos HIDL 4.0 (el layout legacy mezclaba VOLUME_CTRL 0x400 = INSERT_EXCLUSIVE moderno; omega con flags=0 no era el origen del -38). Tests: 8 JVM nuevos (classifyOmegaFailure/omegaFailureHint) + test nativo de flags.
# v2.5.375: Ruta B — el broadcast SIGUE sin llegar en este ROM y el sondeo de la 374 era solo diagnóstico (AOSP anonimiza: sessionId=-1 sin MODIFY_AUDIO_ROUTING). Fix en dos capas que NO dependen del broadcast: (1) sondeo por reflexión con el nombre CORRECTO getSessionId() (@SystemApi/@hide; getAudioSessionId() no existe) + getClientUid(), runtime-only y fail-closed, que abre las sesiones con ID real y registra el valor observado; (2) omega GLOBAL en la mezcla de salida (sesión 0) como fallback cuando todas las configs llegan anonimizadas y ningún omega está acoplado — la única vía que no necesita el sessionId de TIDAL/YouTube Music; guarda anti-doble-procesado (openSession no crea efectos por sesión mientras el global esté activo), backoff 30 s, chequeo de vida en el watchdog y liberación en releaseAll(). Permiso MODIFY_AUDIO_ROUTING declarado en el Manifest (requisito para que el sondeo devuelva IDs reales si la app llega a ser privilegiada; no concede nada a una app normal). Tests JVM nuevos: 7 (isUsableSessionId/usableSessionIds).
# v2.5.376: driver UDP real (IVNF) y tarjeta de UI para el bucle cerrado neuro-acustico; sin datos simulados; sin prueba fisica con sensor.
# v2.5.377: Operador unificado IVANNA — fusión matemática de OmniSpatial (separación por fuentes + colocación 3D) + HRTF personalizada con gradiente por MAA (30-52% menos cómputo) + escena auto-supervisada estilo AudioSphere + campo neural INAF (SIREN, renderer por muestra sin STFT) + convergencia Omega-SAFMUS (Kuramoto K=40, 4º tono emergente 884 Hz, r=0.9636). Un solo operador homogéneo, ACTIVO por defecto (amount 1.0), ORBE y HOLOS siguen activos; cadena Ruta A: ORBE → HOLOS → OMNI-FIELD → Φ. Fail-closed. CTest host 870/870.
# v2.5.378: Ruta B — causa raíz del Error -38: el APM tiene un presupuesto TOTAL para todos los efectos de 512 KB (MAX_EFFECTS_MEMORY) y omega declaraba memoryUsage=1024 KB, así que el registro fallaba SIEMPRE con INVALID_OPERATION (-38) en cualquier sesión. Fix de una línea: memoryUsage 1024 → 128 KB (solo una pista de presupuesto, no una asignación real). El descubrimiento ya funcionaba (sesión 297 de YouTube Music encontrada por sondeo).
# v2.5.380: Ruta B — sin fallback global (quita el mute de YTM) + passthrough garantizado en omega_process + diagnostico visible del fallo de acople (logs en los 3 retornos silenciosos + exchange(), throttle 1/30 s); T0 confirmo que el descriptor NO necesita bajarse (APM 128 KB, max 129 KB). ORBE optimizado: invariantes por banda fuera del bucle por bin + 2 pow en vez de 4 + anillo en dos tramos + 2 FFT reales en una compleja (throughput 3.9x -> 6.3x RT, THD+N/IMD iguales o mejores). CTest host 885/885.
# v2.5.379: Ruta B — descubrimiento del sessionId REAL por el daemon root (dumpsys media.audio_flinger, cada 3 s), publicado en el snapshot (ABI v11: discovered_session_id + discovered_session_gen, offsets viejos intactos) + GET_STATUS; la app acopla omega a la sesión real en vez de la sesión 0 (que en este G85 falla en silencio: el efecto se crea pero nunca recibe frames) y libera el global ANTES de acoplar, en el mismo ciclo del watchdog (la carrera que mató los hot fixes por broadcast). Sesión 0 y sondeo por reflexión quedan como fallback. Tests: 13/13 nuevos (test_session_discovery) + 5 JVM (shouldAttachDiscoveredSession) + 5 Robolectric (RouteBDiscoveredSessionTest).
