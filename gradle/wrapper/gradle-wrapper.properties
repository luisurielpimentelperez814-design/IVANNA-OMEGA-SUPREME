distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
# FIX (auditoria flanco Gradle raiz, 2026-09-10): ancla de integridad del
# wrapper. Sin checksum, un zip comprometido de Gradle pasaria inadvertido en
# cualquier build (vector de supply chain). Valor oficial publicado por Gradle
# en services.gradle.org/distributions/gradle-8.9-bin.zip.sha256.
distributionSha256Sum=d725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
networkTimeout=120000
validateDistributionUrl=true
# FIX #43: Extended timeouts for slow networks
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
